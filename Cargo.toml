[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/discover",
    "crates/parser",
    "crates/indexer",
    "crates/resolver",
    "crates/search",
    "crates/embed-native",
    "crates/qwen35-native",
    "crates/freshness",
    "crates/greppy",
    "crates/cli",
    "crates/edit",
    "crates/agent",
    "crates/workspace-core",
    "crates/workspace-provider",
    "crates/workspace-ffi",
    "crates/web-client",
]

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Local code navigation for coding agents: deterministic code graph, native semantic search, and byte-exact grep passthrough."
repository = "https://github.com/metric-space-ai/greppy"
homepage = "https://github.com/metric-space-ai/greppy"
readme = "README.md"
keywords = ["grep", "code-search", "code-graph", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace.dependencies]
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
which = "6"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
sha2 = "0.10"
blake3 = "1"
filetime = "0.2"
notify = "8.2"
tempfile = "3"
regex = "1"
toml_edit = "0.22"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-r = "1.3"
ignore = "0.4"
walkdir = "2"
rayon = "1"
libc = "0.2"
windows-sys = "0.61"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

# Only the `sha2` crate in debug (build-script and library). Does not opt
# all build scripts/proc-macros (that would rebuild syn/tree-sitter at
# opt-level 3). Release profiles unchanged. CLI `build.rs` still SHA-256s
# the GGUF files; unoptimized `compress` is CPU-bound for minutes.
[profile.dev.package.sha2]
opt-level = 3
