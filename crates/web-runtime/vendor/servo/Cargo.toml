[package]
edition = "2024"
rust-version = "1.88.0"
name = "servo"
version = "0.5.0"
authors = ["The Servo Project Developers"]
build = false
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A component of the servo web-engine."
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
resolver = "2"

[features]
background_hang_monitor = ["servo-background-hang-monitor/sampler"]
baked-in-resources = ["dep:servo-default-resources"]
bluetooth = [
    "servo-bluetooth-traits",
    "dep:servo-bluetooth",
    "servo-constellation/bluetooth",
    "servo-constellation-traits/bluetooth",
    "script/bluetooth",
    "script_traits/bluetooth",
]
bundled_freetype = ["fonts/bundled_freetype"]
clipboard = ["dep:arboard"]
crown = ["script/crown"]
debugmozjs = ["script/debugmozjs"]
default = [
    "baked-in-resources",
    "bundled_freetype",
    "clipboard",
    "js_jit",
]
dynamic_freetype = ["webrender/dynamic_freetype"]
gamepad = [
    "script/gamepad",
    "servo-constellation/gamepad",
    "embedder_traits/gamepad",
]
jitspew = ["script/jitspew"]
js_backtrace = ["script/js_backtrace"]
js_jit = ["script/js_jit"]
media-gstreamer = [
    "servo-media-gstreamer",
    "gstreamer",
]
native-bluetooth = ["servo-bluetooth/native-bluetooth"]
no-wgl = [
    "mozangle/egl",
    "mozangle/build_dlls",
    "surfman/sm-angle-default",
    "paint_api/no-wgl",
]
profilemozjs = ["script/profilemozjs"]
testbinding = ["script/testbinding"]
tracing = [
    "dep:tracing",
    "paint/tracing",
    "paint_api/tracing",
    "servo-constellation/tracing",
    "fonts/tracing",
    "layout/tracing",
    "profile_traits/tracing",
    "script/tracing",
    "net/tracing",
]
vello = ["servo-constellation/vello"]
webgl_backtrace = [
    "script/webgl_backtrace",
    "webgl/webgl_backtrace",
    "servo-canvas-traits/webgl_backtrace",
]
webgpu = [
    "dep:webgpu",
    "script/webgpu",
    "paint/webgpu",
    "servo-constellation/webgpu",
    "servo-constellation-traits/webgpu",
]
webxr = [
    "dep:webxr",
    "dep:webxr-api",
    "paint/webxr",
    "webgl/webxr",
    "script/webxr",
]

[lib]
name = "servo"
crate-type = ["rlib"]
path = "lib.rs"

[[example]]
name = "winit_minimal"
path = "examples/winit_minimal.rs"

[[test]]
name = "accessibility"
path = "tests/accessibility.rs"

[[test]]
name = "javascript_evaluator"
path = "tests/javascript_evaluator.rs"

[[test]]
name = "largest_contentful_paint"
path = "tests/largest_contentful_paint.rs"

[[test]]
name = "multiprocess"
path = "tests/multiprocess.rs"
harness = false

[[test]]
name = "network_manager"
path = "tests/network_manager.rs"

[[test]]
name = "performance_paint_timing"
path = "tests/performance_paint_timing.rs"

[[test]]
name = "servo"
