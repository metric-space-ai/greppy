[package]
edition = "2024"
rust-version = "1.88.0"
name = "servo-script"
version = "0.5.0"
authors = ["The Servo Project Developers"]
build = "build.rs"
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A component of the servo web-engine."
readme = false
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
resolver = "2"

[features]
bluetooth = [
    "servo-bluetooth-traits",
    "script_bindings/bluetooth",
]
crown = ["js/crown"]
debugmozjs = ["js/debugmozjs"]
gamepad = [
    "script_bindings/gamepad",
    "embedder_traits/gamepad",
]
jitspew = ["js/jitspew"]
js_backtrace = []
js_jit = ["js/jit"]
profilemozjs = ["js/profilemozjs"]
testbinding = ["script_bindings/testbinding"]
tracing = [
    "dep:tracing",
    "script_bindings/tracing",
]
webgl_backtrace = ["servo-canvas-traits/webgl_backtrace"]
webgpu = [
    "dep:script_webgpu",
    "dep:webgpu_traits",
    "dep:wgpu-core",
    "dep:wgpu-types",
    "script_bindings/webgpu",
    "script_traits/webgpu",
]
webxr = [
    "gamepad",
    "webxr-api",
    "script_bindings/webxr",
]

[lib]
name = "script"
path = "lib.rs"

