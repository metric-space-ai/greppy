[package]
name = "web-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["controller-runtime", "content-runtime"]
controller-runtime = ["dep:deno_core", "dep:deno_error", "dep:tokio"]
content-runtime = ["dep:servo", "dep:dpi", "dep:png", "dep:http"]

[dependencies]
greppy-web-client = { path = "../../web-client" }
sha2 = "0.10"
url = "2.5"
deno_core = { version = "=0.410.0", optional = true }
deno_error = { version = "=0.7.1", optional = true }
dpi = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
servo = { version = "=0.5.0", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "macros"] }
png = { version = "0.17", optional = true }
http = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
fst = "0.4"
servo-net = { path = "../vendor/servo-net" }

[[bin]]
name = "web-runtime"
path = "src/bin/web-runtime.rs"
required-features = ["controller-runtime", "content-runtime"]

[[test]]
name = "process-boundary"
path = "tests/process-boundary.rs"
required-features = ["controller-runtime", "content-runtime"]

[[test]]
name = "phase1-spike"
path = "tests/phase1-spike.rs"
required-features = ["controller-runtime", "content-runtime"]

[[test]]
name = "session-daemon"
path = "tests/session-daemon.rs"
required-features = ["controller-runtime", "content-runtime"]
