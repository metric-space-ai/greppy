[package]
name = "web-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
controller-runtime = ["dep:deno_core", "dep:deno_error", "dep:tokio"]
content-runtime = ["dep:servo", "dep:dpi", "dep:url"]

[dependencies]
greppy-web-client = { path = "../../web-client" }
deno_core = { version = "=0.410.0", optional = true }
deno_error = { version = "=0.7.1", optional = true }
dpi = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
servo = { version = "=0.5.0", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "macros"] }
url = { version = "2.5", optional = true }

[[bin]]
name = "web-runtime-supervisor"
path = "src/bin/web-runtime-supervisor.rs"

[[bin]]
name = "web-controller-worker"
path = "src/bin/web-controller-worker.rs"
required-features = ["controller-runtime"]

[[bin]]
name = "web-content-worker"
path = "src/bin/web-content-worker.rs"
required-features = ["content-runtime"]

[[test]]
name = "process-boundary"
path = "tests/process-boundary.rs"
required-features = ["controller-runtime", "content-runtime"]

[[test]]
name = "phase1-spike"
path = "tests/phase1-spike.rs"
required-features = ["controller-runtime", "content-runtime"]

[[test]]
name = "session-daemon"
path = "tests/session-daemon.rs"
required-features = ["controller-runtime", "content-runtime"]
