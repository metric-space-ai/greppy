[package]
name = "greppy-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "greppy agent wire layer: provider-neutral protocol types and Anthropic Messages SSE client"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
greppy-workspace-core = { path = "../workspace-core" }
filetime = { workspace = true }
# Plain HTTP only (localhost gateway). No TLS stack.
ureq = { version = "2", default-features = false }
# Async I/O stays on a request-local runtime so ACP can drop blocked reads.
reqwest = { version = "0.12.28", default-features = false }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }

# Landlock write-confinement for tool subprocesses (Linux only; macOS uses
# sandbox-exec / Seatbelt, which needs no extra crate).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }
