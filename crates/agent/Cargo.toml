[package]
name = "greppy-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "greppy agent wire layer: provider-neutral protocol types and Anthropic Messages SSE client"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
greppy-rift-core = { git = "https://github.com/mkh-welsch/rift", rev = "1e93e3cd1b06fde5ea73671d5febd496473fa549" }
# Plain HTTP only (localhost gateway). No TLS stack.
ureq = { version = "2", default-features = false }

# Landlock write-confinement for tool subprocesses (Linux only; macOS uses
# sandbox-exec / Seatbelt, which needs no extra crate).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
serde_json = { workspace = true }
