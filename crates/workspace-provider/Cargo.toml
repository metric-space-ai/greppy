[package]
name = "greppy-workspace-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Thin native filesystem adapters for Greppy's portable Chunk-CoW workspaces"

[[bin]]
name = "greppy-workspace-provider"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
greppy-workspace-core = { path = "../workspace-core" }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
filetime = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
cc = "1.2"
