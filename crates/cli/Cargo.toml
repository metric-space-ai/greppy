[package]
name = "greppy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "greppy unified CLI for grep-compatible search, code navigation, and semantic search"

[[bin]]
name = "greppy"
path = "src/main.rs"
test = false

[dependencies]
greppy-agent = { path = "../agent" }
greppy-core = { path = "../core" }
greppy-edit = { path = "../edit" }
greppy-discover = { path = "../discover" }
greppy-embed-native = { path = "../embed-native" }
greppy-freshness = { path = "../freshness" }
greppy-passthrough = { path = "../greppy" }
greppy-parser = { path = "../parser" }
greppy-indexer = { path = "../indexer" }
greppy-qwen35-native = { path = "../qwen35-native" }
greppy-search = { path = "../search" }
greppy-store = { path = "../store" }
clap = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# EmbeddingGemma and Qwen3.5 are product assets, not optional features. Every
# build bakes both models and tokenizers into the binary. The only inference
# build choices are the accelerated backends; CPU is always available.
[features]
default = ["bash-smart"]
# bash-smart ships in 0.3.0. The v1 layers are training-free by construction —
# byte-preserving capture, mechanical skeletons, arithmetic repetition collapse,
# hash-guarded paged expansion — so they need no classifier head. The 250k
# EmbeddingGemma adapter that will lift signal lines is a later improvement to
# an already-shipping command, not a precondition for it. The prompt therefore
# promises the mechanics and says nothing about classification.
bash-smart = []
# Internal debug/CI fixture mode. It replaces the 827 MB payloads with four
# SHA-verified sentinels so non-inference integration tests can start quickly.
# Release builds reject this feature at compile time; product builds always use
# both real embedded models.
ci-test-assets = []
# Internal release-benchmark build. This keeps Store-CoW timing independent of
# model inference while preserving the production rule that release binaries
# ignore GREPPY_TEST_SKIP_INFERENCE. It is never enabled for shipped artifacts.
store-cow-release-perf = []
# GPU inference for both embedded models. It is NOT opt-in: the target sections
# below enable the platform backend on every build, because a CPU-only binary is
# not a slower greppy, it is a different product -- measured on this repo, one
# navigation summary costs 7.5 s on CPU and 0.3 s on the GPU, and nothing fails
# when the backend is missing, so an accidental CPU build is invisible until
# someone wonders why everything crawls. `lib.rs` asserts the backend at compile
# time; the only way out is `--features cpu-only`, which says so out loud.
metal = ["greppy-embed-native/metal", "greppy-indexer/metal", "greppy-qwen35-native/metal"]
accelerate = []
cuda = ["greppy-embed-native/cuda", "greppy-indexer/cuda", "greppy-qwen35-native/cuda"]
# Deliberately building without a GPU backend. Only for platforms that have
# none, and for measuring against the CPU path.
cpu-only = []

# Cargo cannot make `default` depend on the target, so the platform backend is
# enabled through the dependency instead: features are additive, so these
# declarations union with the ones above and every macOS build gets Metal, every
# Linux/Windows build gets CUDA, with no flag to remember and none to forget.
[target.'cfg(target_os = "macos")'.dependencies]
greppy-embed-native = { path = "../embed-native", features = ["metal"] }
greppy-indexer = { path = "../indexer", features = ["metal"] }
greppy-qwen35-native = { path = "../qwen35-native", features = ["metal"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
greppy-embed-native = { path = "../embed-native", features = ["cuda"] }
greppy-indexer = { path = "../indexer", features = ["cuda"] }
greppy-qwen35-native = { path = "../qwen35-native", features = ["cuda"] }

[build-dependencies]
sha2 = { workspace = true }
