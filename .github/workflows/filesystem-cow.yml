name: Portable CoW

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_platform_performance:
        description: >-
          Run the exact-SHA real-provider performance set on Linux x86_64,
          macOS ARM64 and Windows x86_64. The macOS runner must be ephemeral,
          MDM-preapproved for the Greppy FSKit identity, and carry the
          greppy-fskit-performance label.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portable-cow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  core-contract:
    name: Chunk-CoW core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Cache cargo registry and git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: portable-cow-core-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build exact Greppy WinFsp transport fork
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fork = Join-Path $env:RUNNER_TEMP 'greppy-winfsp-fork'
          tools/build_winfsp_fork.ps1 -Destination $fork
          "GREPPY_WINFSP_FORK_ROOT=$fork" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test filesystem-independent namespace and Chunk-CAS
        run: |
          cargo test -p greppy-workspace-core --locked
          cargo test -p greppy-workspace-ffi --locked

      - name: Compile shared provider binary surface
        run: |
          cargo check -p greppy-workspace-provider --locked
          cargo test -p greppy-workspace-provider --test mounted_contract_compile --no-run --locked

      - name: Build and validate macOS 15.4 FSKit application bundle
        if: runner.os == 'macOS'
        run: |
          platform/macos/build-fskit-app.sh "$RUNNER_TEMP/greppy-fskit"
          test -x "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app/Contents/MacOS/GreppyWorkspaceFS"
          test -x "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app/Contents/Extensions/GreppyWorkspaceFS.appex/Contents/MacOS/GreppyWorkspaceFSExtension"
          codesign --verify --deep --strict "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app"
          plutil -lint \
            platform/macos/GreppyWorkspaceApp/Info.plist \
            platform/macos/GreppyWorkspaceFS/Info.plist \
            platform/macos/GreppyWorkspaceApp/GreppyWorkspaceApp.entitlements \
            platform/macos/GreppyWorkspaceFS/GreppyWorkspaceFS.entitlements

  linux-fuse3:
    name: Linux FUSE3 provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Install FUSE3 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          test -c /dev/fuse

      - name: Compile Linux adapter without host-filesystem CoW dependencies
        run: cargo build -p greppy-workspace-provider --release --locked

      - name: Mount and exercise Chunk-CoW plus private Git namespace
        env:
          GREPPY_RUN_FUSE_TEST: "1"
        run: timeout 300s cargo test -p greppy-workspace-provider --test linux_mount --locked -- --nocapture

      - name: Reject legacy native backend source and dependencies
        shell: bash
        run: |
          ! git grep -n -E 'rift-workspace|RiftWorkspace|btrfs subvolume|clonefile' -- Cargo.toml Cargo.lock crates/agent/Cargo.toml crates/agent/src/portable_workspace.rs crates/workspace-core crates/workspace-provider

  linux-release-performance:
    name: Linux portable CoW hard performance gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Install FUSE3 runtime and representative toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 nodejs
          test -c /dev/fuse
          rustc --version
          python3 --version
          node --version

      - name: Build release provider and measurement harness
        run: |
          cargo build -p greppy-workspace-provider --release --locked
          cargo build -p greppy-workspace-provider --example release_performance --release --locked

      - name: Materialize exact 300k-file fixture
        shell: bash
        run: |
          python3 tools/generate_portable_cow_fixture.py \
            "$RUNNER_TEMP/greppy-cow-perf-repo" \
            --files 300000 \
            --modules 24

      - name: Mount provider and run hard gate
        id: performance
        shell: bash
        run: |
          data="$RUNNER_TEMP/greppy-cow-perf-data"
          mount="$RUNNER_TEMP/greppy-cow-perf-mount"
          evidence="$RUNNER_TEMP/greppy-cow-perf-linux.json"
          mkdir -p "$data" "$mount"
          target/release/greppy-workspace-provider \
            --data-root "$data" --mount-root "$mount" \
            >"$RUNNER_TEMP/greppy-cow-provider.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/greppy-cow-provider.pid"
          for _ in $(seq 1 200); do
            test -f "$data/provider.json" && mountpoint -q "$mount" && break
            sleep 0.1
          done
          mountpoint -q "$mount"
          hardware="$(lscpu | tr '\n' ';')"
          timeout --signal=TERM --kill-after=15s 8m target/release/examples/release_performance \
            --repository "$RUNNER_TEMP/greppy-cow-perf-repo" \
            --data-root "$data" \
            --probe-path files/000/000000.txt \
            --output "$evidence" \
            --phase-trace-dir "$RUNNER_TEMP/greppy-cow-perf-phases" \
            --source-commit "$GITHUB_SHA" \
            --provider-binary "$GITHUB_WORKSPACE/target/release/greppy-workspace-provider" \
            --native-baseline-root "$RUNNER_TEMP/greppy-native-worktree-baseline" \
            --hardware "$hardware" \
            --toolchain-case '{"name":"rust","cwd":"rust","argv":["rustc","main.rs","-o","/tmp/greppy-perf-rust"]}' \
            --toolchain-case '{"name":"python","cwd":"python","argv":["python3","-B","test_sample.py"]}' \
            --toolchain-case '{"name":"node","cwd":"node","argv":["npm","test","--silent"]}' \
            --toolchain-case '{"name":"node-startup-diagnostic","cwd":"node","argv":["node","test.js"],"release_gate":false}' \
            --enforce

      - name: Unmount provider
        if: always()
        shell: bash
        run: |
          mount="$RUNNER_TEMP/greppy-cow-perf-mount"
          mountpoint -q "$mount" && fusermount3 -u "$mount" || true
          test -f "$RUNNER_TEMP/greppy-cow-provider.pid" && kill "$(cat "$RUNNER_TEMP/greppy-cow-provider.pid")" || true

      - name: Upload raw performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-cow-performance-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/greppy-cow-perf-linux.json
            ${{ runner.temp }}/greppy-cow-provider.log
            ${{ runner.temp }}/greppy-cow-perf-phases/*.jsonl
          if-no-files-found: error

  windows-winfsp:
    name: Windows Greppy WinFsp fork/provider compile
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Build exact Greppy WinFsp transport fork
        shell: pwsh
        run: |
          $fork = Join-Path $env:RUNNER_TEMP 'greppy-winfsp-fork'
          tools/build_winfsp_fork.ps1 -Destination $fork
          "GREPPY_WINFSP_FORK_ROOT=$fork" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rust provider over the Greppy fork ABI
        run: cargo build -p greppy-workspace-provider --release --locked

      - name: Bind only the private Greppy runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:GREPPY_WINFSP_FORK_ROOT 'build\VStudio\build\Release\greppyworkspacefsp-x64.dll'
          Copy-Item -LiteralPath $runtime -Destination target\release\greppyworkspacefsp-x64.dll
          $imports = (& dumpbin /imports target\release\greppy-workspace-provider.exe) -join "`n"
          if ($imports -notmatch '(?i)greppyworkspacefsp-x64\.dll') {
            throw 'provider does not import the Greppy WinFsp runtime'
          }
          if ($imports -match '(?im)^\s*winfsp-x64\.dll\s*$') {
            throw 'provider still imports the official WinFsp runtime'
          }

  windows-winfsp-fork-compile:
    name: Windows minimal WinFsp fork compile
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact Greppy candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify fork metadata and patch
        run: python tools/verify_winfsp_fork.py

      - name: Build exact patched WinFsp x86_64 transport
        shell: pwsh
        run: |
          $fork = Join-Path $env:RUNNER_TEMP 'winfsp-greppy'
          tools/build_winfsp_fork.ps1 -Destination $fork
          if (Test-Path "$fork\build\VStudio\build\Release\winfsp-x64.sys") {
            throw 'fork emitted the official WinFsp driver identity'
          }

  macos-release-performance:
    name: macOS ARM64 real FSKit performance
    if: github.event_name == 'workflow_dispatch' && inputs.full_platform_performance
    runs-on: [self-hosted, macOS, ARM64, greppy-fskit-performance, ephemeral]
    timeout-minutes: 45
    env:
      CODE_SIGN_IDENTITY: ${{ vars.MACOS_CODE_SIGN_IDENTITY }}
      FSKIT_PROFILE_BASE64: ${{ secrets.MACOS_FSKIT_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'
      - name: Require an ephemeral preapproved FSKit runner
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 15
          test -n "$CODE_SIGN_IDENTITY"
          test -n "$FSKIT_PROFILE_BASE64"
          security find-identity -v -p codesigning | grep -F "$CODE_SIGN_IDENTITY"
          data="$HOME/Library/Group Containers/group.ai.metricspace.greppy/workspace"
          mount="$HOME/Library/Group Containers/group.ai.metricspace.greppy/workspace-mount"
          test ! -e "$data"
          test ! -e "$mount"
      - name: Build and install the exact signed FSKit provider
        shell: bash
        run: |
          fskit_profile="$RUNNER_TEMP/greppy-fskit-extension.provisionprofile"
          printf '%s' "$FSKIT_PROFILE_BASE64" | base64 -D > "$fskit_profile"
          FSKIT_PROVISIONING_PROFILE="$fskit_profile" \
            platform/macos/build-fskit-app.sh "$RUNNER_TEMP/fskit"
          app="$RUNNER_TEMP/fskit/GreppyWorkspaceFS.app"
          codesign --verify --deep --strict "$app"
          sudo -n ditto "$app" /Applications/GreppyWorkspaceFS.app
          pluginkit -a /Applications/GreppyWorkspaceFS.app
          pluginkit -m -A -D -i ai.metricspace.greppy.workspacefs.extension | \
            grep -F ai.metricspace.greppy.workspacefs.extension
      - name: Build release harness and exact fixture
        shell: bash
        run: |
          cargo build -p greppy-workspace-provider --example release_performance --release --locked
          python3 tools/generate_portable_cow_fixture.py \
            "$RUNNER_TEMP/greppy-cow-perf-repo" --files 300000 --modules 24
      - name: Mount the real FSKit extension
        shell: bash
        run: |
          resource="$RUNNER_TEMP/greppy-workspace-resource.img"
          mount="$HOME/Library/Group Containers/group.ai.metricspace.greppy/workspace-mount"
          mkfile 1m "$resource"
          device="$(hdiutil attach -nomount -imagekey diskimage-class=CRawDiskImage "$resource" | awk 'NR == 1 { print $1 }')"
          test -n "$device"
          echo "$device" >"$RUNNER_TEMP/fskit-device"
          mkdir -p "$mount"
          mount -t greppy-cow "$device" "$mount" >"$RUNNER_TEMP/greppy-cow-provider-macos.log" 2>&1
          data="$HOME/Library/Group Containers/group.ai.metricspace.greppy/workspace"
          for _ in $(seq 1 300); do
            test -f "$data/provider.json" && mount | grep -F " on $mount " && exit 0
            sleep 0.1
          done
          echo "FSKit provider did not become healthy" >&2
          exit 1
      - name: Run hard gate over the real FSKit mount
        timeout-minutes: 10
        shell: bash
        run: |
          data="$HOME/Library/Group Containers/group.ai.metricspace.greppy/workspace"
          provider="/Applications/GreppyWorkspaceFS.app/Contents/Extensions/GreppyWorkspaceFS.appex/Contents/MacOS/GreppyWorkspaceFSExtension"
          target/release/examples/release_performance \
            --repository "$RUNNER_TEMP/greppy-cow-perf-repo" \
            --data-root "$data" \
            --probe-path files/000/000000.txt \
            --output "$RUNNER_TEMP/greppy-cow-perf-macos.json" \
            --phase-trace-dir "$RUNNER_TEMP/greppy-cow-perf-phases-macos" \
            --source-commit "$GITHUB_SHA" \
            --provider-binary "$provider" \
            --native-baseline-root "$RUNNER_TEMP/greppy-native-worktree-baseline" \
            --hardware "$(system_profiler SPHardwareDataType | tr '\n' ';')" \
            --toolchain-case '{"name":"rust","cwd":"rust","argv":["rustc","main.rs","-o","/tmp/greppy-perf-rust"]}' \
            --toolchain-case '{"name":"python","cwd":"python","argv":["python3","-B","test_sample.py"]}' \
            --toolchain-case '{"name":"node","cwd":"node","argv":["npm","test","--silent"]}' \
            --toolchain-case '{"name":"node-startup-diagnostic","cwd":"node","argv":["node","test.js"],"release_gate":false}' \
            --enforce
      - name: Cleanup FSKit mount
        if: always()
        shell: bash
        run: |
          mount="$HOME/Library/Group Containers/group.ai.metricspace.greppy/workspace-mount"
          mount | grep -F " on $mount " >/dev/null && diskutil unmount force "$mount" || true
          test -f "$RUNNER_TEMP/fskit-device" && \
            hdiutil detach -force "$(cat "$RUNNER_TEMP/fskit-device")" || true
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-cow-performance-macos-${{ github.sha }}
          path: |
            ${{ runner.temp }}/greppy-cow-perf-macos.json
            ${{ runner.temp }}/greppy-cow-provider-macos.log
            ${{ runner.temp }}/greppy-cow-perf-phases-macos/*.jsonl
          if-no-files-found: error

  windows-release-performance:
    name: Windows x86_64 real WinFsp performance
    if: github.event_name == 'workflow_dispatch' && inputs.full_platform_performance
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned unchanged WinFsp runtime and SDK
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a') {
            throw "WinFsp installer checksum mismatch: $actual"
          }
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', 'INSTALLLEVEL=1000')
          if ($install.ExitCode -ne 0) { throw "WinFsp installation failed: $($install.ExitCode)" }
      - name: Build provider, harness and exact fixture
        shell: pwsh
        run: |
          cargo build -p greppy-workspace-provider --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'provider build failed' }
          cargo build -p greppy-workspace-provider --example release_performance --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'harness build failed' }
          python tools/generate_portable_cow_fixture.py "$env:RUNNER_TEMP\greppy-cow-perf-repo" --files 300000 --modules 24
          if ($LASTEXITCODE -ne 0) { throw 'fixture generation failed' }
      - name: Mount the real WinFsp provider
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'greppy-cow-perf-data'
          $mount = Join-Path $env:RUNNER_TEMP 'greppy-cow-perf-mount'
          New-Item -ItemType Directory -Force $data, $mount | Out-Null
          $provider = (Resolve-Path 'target/release/greppy-workspace-provider.exe').Path
          $process = Start-Process $provider -PassThru `
            -ArgumentList @('--data-root', $data, '--mount-root', $mount) `
            -RedirectStandardOutput "$env:RUNNER_TEMP\greppy-cow-provider-windows.stdout.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\greppy-cow-provider-windows.stderr.log"
          $process.Id | Set-Content -Encoding ascii "$env:RUNNER_TEMP\greppy-cow-provider-windows.pid"
          for ($attempt = 0; $attempt -lt 300; $attempt++) {
            if ((Test-Path "$data\provider.json") -and (Test-Path "$mount\.greppy-provider.json")) { exit 0 }
            Start-Sleep -Milliseconds 100
          }
          throw 'WinFsp provider did not become healthy'
      - name: Run hard gate over the real WinFsp mount
        timeout-minutes: 10
        shell: pwsh
        run: |
          $rustOutput = Join-Path $env:RUNNER_TEMP 'greppy-perf-rust.exe'
          $rust = @{name='rust';cwd='rust';argv=@('rustc','main.rs','-o',$rustOutput)} | ConvertTo-Json -Compress
          $python = @{name='python';cwd='python';argv=@('python3','-B','test_sample.py')} | ConvertTo-Json -Compress
          $node = @{name='node';cwd='node';argv=@('npm','test','--silent')} | ConvertTo-Json -Compress
          $startup = @{name='node-startup-diagnostic';cwd='node';argv=@('node','test.js');release_gate=$false} | ConvertTo-Json -Compress
          $hardware = Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json -Compress
          $provider = (Resolve-Path 'target/release/greppy-workspace-provider.exe').Path
          $harness = (Resolve-Path 'target/release/examples/release_performance.exe').Path
          & $harness `
            --repository "$env:RUNNER_TEMP\greppy-cow-perf-repo" `
            --data-root "$env:RUNNER_TEMP\greppy-cow-perf-data" `
            --probe-path 'files/000/000000.txt' `
            --output "$env:RUNNER_TEMP\greppy-cow-perf-windows.json" `
            --phase-trace-dir "$env:RUNNER_TEMP\greppy-cow-perf-phases-windows" `
            --source-commit "$env:GITHUB_SHA" `
            --provider-binary $provider `
            --native-baseline-root "$env:RUNNER_TEMP\greppy-native-worktree-baseline" `
            --hardware $hardware `
            --toolchain-case $rust --toolchain-case $python `
            --toolchain-case $node --toolchain-case $startup --enforce
          if ($LASTEXITCODE -ne 0) { throw "performance gate failed: $LASTEXITCODE" }
      - name: Cleanup provider
        if: always()
        shell: pwsh
        run: |
          $pidPath = Join-Path $env:RUNNER_TEMP 'greppy-cow-provider-windows.pid'
          if (Test-Path $pidPath) {
            Stop-Process -Id ([int](Get-Content $pidPath)) -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-cow-performance-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/greppy-cow-perf-windows.json
            ${{ runner.temp }}/greppy-cow-provider-windows.*.log
            ${{ runner.temp }}/greppy-cow-perf-phases-windows/*.jsonl
          if-no-files-found: error

  verify-platform-performance:
    name: Exact-SHA three-platform performance set
    if: github.event_name == 'workflow_dispatch' && inputs.full_platform_performance
    needs:
      - linux-release-performance
      - macos-release-performance
      - windows-release-performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: portable-cow-performance-*-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - name: Verify complete immutable evidence set
        run: |
          python3 tools/verify_portable_cow_performance.py \
            --source-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/portable-cow-performance-set.json" \
            "$RUNNER_TEMP/evidence/greppy-cow-perf-linux.json" \
            "$RUNNER_TEMP/evidence/greppy-cow-perf-macos.json" \
            "$RUNNER_TEMP/evidence/greppy-cow-perf-windows.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-cow-performance-complete-${{ github.sha }}
          path: ${{ runner.temp }}/portable-cow-performance-set.json
          if-no-files-found: error

  portable-agent-contract:
    name: Portable agent lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Test proposal, apply and fail-closed adapter lifecycle
        run: cargo test -p greppy-agent --locked

      - name: Test CLI provider lifecycle
        env:
          CI: "true"
        run: >-
          cargo test -p greppy --test agent_p
          --no-default-features
          --features ci-test-assets,cpu-only,bash-smart
          --locked
