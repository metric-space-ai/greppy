name: Portable CoW

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-cow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  core-contract:
    name: Chunk-CoW core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Cache cargo registry and git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: portable-cow-core-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install pinned unchanged WinFsp 2.1 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a') {
            throw "WinFsp installer checksum mismatch: $actual"
          }
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', 'INSTALLLEVEL=1000')
          if ($install.ExitCode -ne 0) { throw "WinFsp installation failed: $($install.ExitCode)" }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\WinFsp\inc\fuse3\fuse.h")) {
            throw 'WinFsp Developer headers were not installed'
          }

      - name: Test filesystem-independent namespace and Chunk-CAS
        run: |
          cargo test -p greppy-workspace-core --locked
          cargo test -p greppy-workspace-ffi --locked

      - name: Compile shared provider binary surface
        run: cargo check -p greppy-workspace-provider --locked

      - name: Build and validate macOS 15.4 FSKit application bundle
        if: runner.os == 'macOS'
        run: |
          platform/macos/build-fskit-app.sh "$RUNNER_TEMP/greppy-fskit"
          test -x "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app/Contents/MacOS/GreppyWorkspaceFS"
          test -x "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app/Contents/Extensions/GreppyWorkspaceFS.appex/Contents/MacOS/GreppyWorkspaceFSExtension"
          codesign --verify --deep --strict "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app"
          plutil -lint \
            platform/macos/GreppyWorkspaceApp/Info.plist \
            platform/macos/GreppyWorkspaceFS/Info.plist \
            platform/macos/GreppyWorkspaceApp/GreppyWorkspaceApp.entitlements \
            platform/macos/GreppyWorkspaceFS/GreppyWorkspaceFS.entitlements

  linux-fuse3:
    name: Linux FUSE3 provider
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Install FUSE3 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          test -c /dev/fuse

      - name: Compile Linux adapter without host-filesystem CoW dependencies
        run: cargo build -p greppy-workspace-provider --release --locked

      - name: Mount and exercise Chunk-CoW plus private Git namespace
        env:
          GREPPY_RUN_FUSE_TEST: "1"
        run: timeout 300s cargo test -p greppy-workspace-provider --test linux_mount --locked -- --nocapture

      - name: Reject legacy native backend source and dependencies
        shell: bash
        run: |
          ! git grep -n -E 'rift-workspace|RiftWorkspace|btrfs subvolume|clonefile' -- Cargo.toml Cargo.lock crates/agent/Cargo.toml crates/agent/src/portable_workspace.rs crates/workspace-core crates/workspace-provider

  windows-winfsp:
    name: Windows WinFsp provider
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Install pinned unchanged WinFsp 2.1 runtime and SDK
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a') {
            throw "WinFsp installer checksum mismatch: $actual"
          }
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', 'INSTALLLEVEL=1000')
          if ($install.ExitCode -ne 0) { throw "WinFsp installation failed: $($install.ExitCode)" }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\WinFsp\bin\winfsp-x64.dll")) {
            throw 'WinFsp runtime was not installed'
          }

      - name: Build Rust provider over the official WinFsp FUSE ABI
        run: cargo build -p greppy-workspace-provider --release --locked

      - name: Mount and exercise Chunk-CoW on WinFsp
        env:
          GREPPY_RUN_WINFSP_TEST: "1"
        run: cargo test -p greppy-workspace-provider --test windows_mount --locked -- --nocapture

  portable-agent-contract:
    name: Portable agent lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Test proposal, apply and fail-closed adapter lifecycle
        run: cargo test -p greppy-agent --locked

      - name: Test CLI provider lifecycle
        env:
          CI: "true"
        run: >-
          cargo test -p greppy --test agent_p
          --no-default-features
          --features ci-test-assets,cpu-only,bash-smart
          --locked
