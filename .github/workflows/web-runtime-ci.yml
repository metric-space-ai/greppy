name: web-runtime compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/web-runtime-ci.yml'
      - 'assets/prompts/web-beta.md'
      - 'crates/agent/**'
      - 'crates/cli/src/web/**'
      - 'crates/web-runtime/**'
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: web-runtime-compatibility-${{ github.ref }}
  # Finish active browser suites; only queued superseded revisions may be replaced.
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"

jobs:
  session-daemon:
    name: session daemon three-run stability
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Check bounded navigation document probes
        run: node --test crates/web-runtime/runtime/tests/navigation-document-probe.cjs

      - name: Check waiter timeout slot lifecycle
        run: node --test crates/web-runtime/runtime/tests/wait-slot-lifecycle.cjs

      - name: Check concurrent fork exec cannot capture unsealed sibling descriptors
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features
          concurrent_fork_exec_does_not_capture_an_unsealed_descriptor
          -- --test-threads=1 --nocapture

      - name: Prove early spawn unlock leaks a real descriptor across exec
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/fork_exec_window.rs')
          original = source.read_text()
          old = '    let _guard = WINDOW.lock().unwrap_or_else(|error| error.into_inner());'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'concurrent_fork_exec_does_not_capture_an_unsealed_descriptor',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, old + '\n    drop(_guard);'))
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'child inherited a descriptor from another spawn window' in (result.stdout + result.stderr)
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=180)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check bounded worker capability framing
        shell: bash
        run: >-
          cargo test --locked
          --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime --no-default-features
          --lib capability_frame -- --test-threads=1

      - name: Check cumulative CPU attribution across sessions and worker restarts
        shell: bash
        run: >-
          cargo test --locked
          --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime --no-default-features
          --lib cpu -- --test-threads=1

      - name: Build exact Greppy CLI test asset
        shell: bash
        env:
          CI: 'true'
        run: cargo build --locked --package greppy --features ci-test-assets

      - name: Install pinned Playwright Chromium oracle
        shell: bash
        env:
          PLAYWRIGHT_VERSION: '1.62.1'
        run: |
          oracle_root="$RUNNER_TEMP/greppy-playwright-oracle"
          mkdir -p "$oracle_root"
          npm install --prefix "$oracle_root" --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
          PLAYWRIGHT_BROWSERS_PATH="$oracle_root/browsers" \
            "$oracle_root/node_modules/.bin/playwright" install chromium
          echo "PLAYWRIGHT_PACKAGE=$oracle_root/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$oracle_root/browsers" >> "$GITHUB_ENV"

      - name: Compile the exact session-daemon suite once
        shell: bash
        run: >-
          cargo test --locked
          --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime
          --test session-daemon
          --no-run

      - name: Check lifecycle fixture never fabricates requests from silent connections
        shell: bash
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime --test session-daemon
          navigation_fixture_closes_silent_connections_without_response -- --test-threads=1 --nocapture

      - name: Prove lifecycle fixture rejects unsolicited successful responses
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/tests/session-daemon.rs')
          original = source.read_text()
          old = 'let n = match stream.read(&mut buffer) {\n                    Ok(0) => return,\n                    Ok(n) => n,'
          assert original.count(old) == 1
          old_error = '.push(format!("request read error: {error}"));\n                        return;'
          assert original.count(old_error) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '--package', 'web-runtime', '--test', 'session-daemon',
                     'navigation_fixture_closes_silent_connections_without_response',
                     '--', '--test-threads=1', '--nocapture']
          try:
              mutated = original.replace(old, old.replace('                    Ok(0) => return,\n', ''))
              mutated = mutated.replace(old_error, old_error.replace('return;', '0'))
              source.write_text(mutated)
              result = subprocess.run(command, capture_output=True, text=True, timeout=300)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'fixture fabricated an HTTP response without a request' in result.stdout + result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=300)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check native history waits for its matching traversal
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime --test session-daemon
          native_history_waits_for_matching_traversal -- --test-threads=1 --nocapture

      - name: Prove missing native receipt cannot report a completed traversal
        run: python3 tools/check_web_history_receipt_mutation.py --native

      - name: Check closing one session preserves its live neighbor and recovery worker
        shell: bash
        run: |
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml \
            --package web-runtime --test session-daemon \
            ordinary_sessions_isolate_cookie_state -- --test-threads=1 --nocapture
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml \
            --package web-runtime --test session-daemon \
            persistent_profile_survives_content_worker_recovery -- --test-threads=1 --nocapture

      - name: Prove duplicate page cleanup destroys the neighboring session
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/daemon.rs')
          original = source.read_text()
          old = '        for page in pages {\n            failed |= self.engine_call("session.closePage", json!({"page": page})).is_err();\n        }'
          assert original.count(old) == 1
          duplicate = '        for page in session.objects.pages_to_close() {\n            failed |= self.engine_call("session.closePage", json!({"page": page})).is_err();\n        }\n'
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '--package', 'web-runtime', '--test', 'session-daemon',
                     'ordinary_sessions_isolate_cookie_state',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, duplicate + old))
              result = subprocess.run(command, capture_output=True, text=True, timeout=300)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'TAB_NOT_FOUND' in result.stdout + result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=300)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check text reads wait for deferred document work without waiting for images
        shell: bash
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime --test session-daemon
          web_read_waits_for_deferred_text_but_not_unrelated_images -- --test-threads=1 --nocapture

      - name: Prove text-read regression detects waiting for unrelated image load
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/daemon.rs')
          original = source.read_text()
          old = 'json!({ "page": page, "url": url, "waitUntil": "domcontentloaded" })'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '--package', 'web-runtime', '--test', 'session-daemon',
                     'web_read_waits_for_deferred_text_but_not_unrelated_images',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, old.replace('domcontentloaded', 'load')))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'text reader waited for an unrelated image resource' in result.stdout + result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check native object lifecycle in a live context
        shell: bash
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime --test session-daemon
          live_context_releases_pages_and_native_object_metadata -- --test-threads=1 --nocapture

      - name: Check oversized accounting and same-worker recovery
        shell: bash
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          --package web-runtime --test session-daemon
          oversized_console_is_a_limit_error_without_restarting_content -- --test-threads=1 --nocapture

      - name: Prove oversized-log regression detects full-record transport
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/supervisor.rs')
          original = source.read_text()
          old = '"page.recordUsage"'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '--package', 'web-runtime', '--test', 'session-daemon',
                     'oversized_console_is_a_limit_error_without_restarting_content',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, '"page.consoleMessages"'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'frame length' in result.stdout + result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Require three stable serial suite passes
        shell: bash
        env:
          # Preserve the last initialization phase on a Content handshake timeout.
          # Do not enable the much noisier per-operation trace or relax deadlines.
          GREPPY_WEB_TRACE_STARTUP: '1'
        run: |
          for attempt in 1 2 3; do
            echo "::group::session-daemon stability pass $attempt/3"
            cargo test --locked \
              --manifest-path crates/web-runtime/Cargo.toml \
              --package web-runtime \
              --test session-daemon \
              -- --test-threads=1
            echo "::endgroup::"
          done
