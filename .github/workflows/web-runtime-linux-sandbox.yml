name: web-runtime Linux sandbox

# Focused gate: Landlock live deny + same-image fexecve on ubuntu-latest.
# Does not build Servo/V8. Does not replace codesign, Windows CI, or soak.
# Live evidence is the job log on ubuntu-latest, not a macOS host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-runtime-linux-sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  RUST_BACKTRACE: "1"
  GREPPY_REQUIRE_LIVE_LANDLOCK: "1"

jobs:
  landlock-fexecve:
    name: Landlock + fexecve (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"

      - name: Prove a silent HTTP connection cannot block another request
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          source = pathlib.Path('crates/web-runtime/runtime/tests/support/recorded_http_fixture.rs')
          original = source.read_text()
          old = 'while index < clients.len() {'
          assert original.count(old) == 1
          with tempfile.TemporaryDirectory(prefix='http-fixture-', dir=os.environ['RUNNER_TEMP']) as directory:
              binary = pathlib.Path(directory) / 'contract'
              def build():
                  subprocess.run(['rustc', '--edition=2021', '--test', str(source), '-o', str(binary)],
                                 check=True, timeout=30)
              command = [str(binary), '--test-threads=1', '--nocapture']
              build()
              subprocess.run(command, check=True, timeout=10)
              try:
                  source.write_text(original.replace(old, 'while index < clients.len().min(1) {'))
                  build()
                  result = subprocess.run(command, capture_output=True, text=True, timeout=10)
                  print(result.stdout, result.stderr)
                  assert result.returncode == 101 and 'independent HTTP request was blocked by silent connection' in result.stdout + result.stderr
              finally:
                  source.write_text(original)
              build()
              subprocess.run(command, check=True, timeout=10)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Prove unobserved HTTP bodies allocate no DevTools copy
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          source = pathlib.Path('crates/web-runtime/vendor/servo-net/devtools_body.rs')
          original = source.read_text()
          old = 'if !channel_present || !pipeline_present || !webview_present {'
          assert original.count(old) == 1
          with tempfile.TemporaryDirectory(prefix='devtools-body-', dir=os.environ['RUNNER_TEMP']) as directory:
              binary = pathlib.Path(directory) / 'contract'
              def build():
                  subprocess.run(['rustc', '--edition=2021', '--test', str(source), '-o', str(binary)],
                                 check=True, timeout=30)
              command = [str(binary), '--test-threads=1', '--nocapture']
              build()
              subprocess.run(command, check=True, timeout=10)
              try:
                  source.write_text(original.replace(old, 'if false && (!channel_present || !pipeline_present || !webview_present) {'))
                  build()
                  result = subprocess.run(command, capture_output=True, text=True, timeout=10)
                  print(result.stdout, result.stderr)
                  assert result.returncode == 101 and 'unobserved HTTP body allocated a DevTools copy' in result.stdout + result.stderr
              finally:
                  source.write_text(original)
              build()
              subprocess.run(command, check=True, timeout=10)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Calibrate the actual web meter with real private memory and CPU
        run: >-
          python3 -B bench/calibrate_web_meter.py
          --output "$RUNNER_TEMP/web-meter-calibration.json" --pairs 6

      - name: Prove omitted CPU and PSS counters invalidate calibration
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-meter-counterproof'
          root.mkdir()
          def run_case(label, capture=False):
              command = ['python3', '-B', '-X', 'pycache_prefix=' + str(root / (label + '.pycache')),
                         'bench/calibrate_web_meter.py', '--contracts-only',
                         '--output', str(root / (label + '.json'))]
              result = subprocess.run(command, capture_output=capture, text=True,
                                      timeout=35, check=not capture)
              if capture:
                  print(result.stdout, result.stderr)
              return result
          cases = [
              ('cpu', pathlib.Path('crates/web-runtime/scripts/measure-web-efficiency.py'),
               'totals[0] += usage.ru_utime', 'totals[0] += 0.0', 'calibration.cpu_accounting'),
              ('pss', pathlib.Path('bench/process_memory.py'),
               'pss_bytes += metrics["Pss"]', 'pss_bytes += 0', 'calibration.pss_step'),
          ]
          for label, source, old, new, expected in cases:
              original = source.read_text()
              assert original.count(old) == 1
              try:
                  source.write_text(original.replace(old, new))
                  result = run_case(label, capture=True)
                  record = json.loads((root / (label + '.json')).read_text())
                  assert result.returncode == 1 and record['status'] == 'failed'
                  assert expected in record['error'], record
                  print('WEB_METER_COUNTER_REJECTED', label, expected)
              finally:
                  source.write_text(original)
          run_case('restored')
          subprocess.run(['git', 'diff', '--exit-code', '--',
                          'crates/web-runtime/scripts/measure-web-efficiency.py',
                          'bench/process_memory.py'], check=True)

      - name: Capture transient peaks in fresh owned kernel cgroups
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'web-meter-kernel-counterproof'
          root.mkdir()
          def run_case(label, capture=False):
              unit = 'greppy-meter-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + label
              parent = '/sys/fs/cgroup/system.slice/' + unit + '.service'
              command = ['sudo', '-n', 'systemd-run', '--unit=' + unit,
                         '--wait', '--collect', '--pipe', '--service-type=exec',
                         '--uid=' + str(os.getuid()), '--gid=' + str(os.getgid()),
                         '--property=Delegate=memory', '--property=DelegateSubgroup=monitor',
                         '--property=MemoryMax=256M', '--property=MemorySwapMax=0',
                         '--property=CPUQuota=100%', '--property=TasksMax=32',
                         '--property=RuntimeMaxSec=60', '--expand-environment=no',
                         '--working-directory=' + str(pathlib.Path.cwd()),
                         'python3', '-B', '-X', 'pycache_prefix=' + str(root / (label + '.pycache')),
                         'bench/calibrate_web_meter.py', '--contracts-only',
                         '--kernel-cgroup-parent', parent, '--output', str(root / (label + '.json'))]
              result = subprocess.run(command, capture_output=capture, text=True,
                                      timeout=75, check=not capture)
              if capture:
                  print(result.stdout, result.stderr)
              return result
          # Only this ephemeral hosted-CI unit gets the declared budget and
          # delegation. No persistent service, parent limit change or host PID
          # migration. systemd waits, bounds the run and collects the unit.
          run_case('normal')
          source = pathlib.Path('bench/process_memory.py')
          cases = [
              ('shared', source, 'or set(map(int, (self.monitor / "cgroup.procs").read_text().split())) != {os.getpid()}', '',
               'calibration.kernel_foreign_monitor'),
              ('outside', source, 'echo "$$" > "$1/cgroup.procs"; ', '', 'calibration.kernel_entry'),
              ('current', source, '"memory_peak_bytes": int((self.path / "memory.peak").read_text())',
               '"memory_peak_bytes": int((self.path / "memory.current").read_text())', 'calibration.kernel_peak'),
              ('rss', pathlib.Path('crates/web-runtime/scripts/measure-web-efficiency.py'),
               "'kernel_resource_accounting': resource_group.snapshot() if resource_group else None,",
               "'kernel_resource_accounting': dict(resource_group.snapshot(), memory_peak_bytes=peak) if resource_group else None,",
               'calibration.kernel_family_peak'),
          ]
          for label, source, old, new, expected in cases:
              original = source.read_text()
              assert original.count(old) == 1
              try:
                  source.write_text(original.replace(old, new))
                  result = run_case(label, capture=True)
                  record = json.loads((root / (label + '.json')).read_text())
                  assert result.returncode == 1 and record['status'] == 'failed'
                  assert expected in record['error'], record
                  print('WEB_METER_KERNEL_COUNTER_REJECTED', label, expected)
              finally:
                  source.write_text(original)
          run_case('restored')
          subprocess.run(['git', 'diff', '--exit-code', '--', 'bench/process_memory.py',
                          'crates/web-runtime/scripts/measure-web-efficiency.py'], check=True)

      - name: Preserve raw meter calibration and counterproofs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-meter-calibration
          path: ${{ runner.temp }}/web-meter-*
          retention-days: 14
          if-no-files-found: error

      - name: Check real process-family PSS and cleanup
        run: python3 bench/test_process_memory.py

      - name: Prove shared pages cannot be reported as summed RSS
        shell: python
        run: |
          import pathlib, subprocess, tempfile
          def run_case(capture=False):
              # Restored equal-size source can otherwise reuse the mutant's
              # timestamp-based .pyc within the same clock second.
              with tempfile.TemporaryDirectory(prefix='greppy-pss-pycache-') as cache:
                  return subprocess.run(['python3', '-X', 'pycache_prefix=' + cache,
                                         'bench/test_process_memory.py'],
                                        capture_output=capture, text=True, timeout=45,
                                        check=not capture)
          source = pathlib.Path('bench/process_memory.py')
          original = source.read_text()
          old = 'pss_bytes += metrics["Pss"]'
          assert original.count(old) == 1
          try:
              source.write_text(original.replace(old, 'pss_bytes += metrics["Rss"]'))
              result = run_case(capture=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 1 and 'AssertionError' in result.stderr
          finally:
              source.write_text(original)
          run_case()
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check typed status over private Unix sockets
        run: cargo test --locked -p greppy-web-client --lib status_probe_ -- --test-threads=1

      - name: Prove transport failure cannot be called an ownership denial
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-client/src/status_probe.rs')
          original = source.read_text()
          old = '_ => StatusProbeError::Transport,'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '-p', 'greppy-web-client', '--lib',
                     'status_probe_silent_connected_peer_is_not_an_ownership_denial', '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, '_ => StatusProbeError::NotOwned,'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'NotOwned' in result.stdout and 'Transport' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check nonretrying engine recovery
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features engine_failure_guidance_is_nonretrying -- --test-threads=1

      - name: Prove engine recovery rejects the old replay recommendation
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/daemon.rs')
          original = source.read_text()
          old = 'inspect greppy web doctor and the current page state; do not automatically repeat the failed operation'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'engine_failure_guidance_is_nonretrying', '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, 'retry the operation or inspect web.doctor'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'engine_failure_guidance_is_nonretrying' in result.stdout and 'FAILED' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)

          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check cancellation identity and completed-receipt memory lifetime
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features operation_control -- --test-threads=1 --nocapture

      - name: Prove finished operations cannot remain active
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/operation_control.rs')
          original = source.read_text()
          old = 'state.active.take()'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'finished_runs_are_not_active_and_old_cancellation_cannot_reach_a_new_run',
                     '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, 'state.active.clone()'))
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'finished operation remained active or cancellable' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=180)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Prove kernel private memory detects leaked completion receipts
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/operation_control.rs')
          original = source.read_text()
          old = 'state.completed = Some(pair);'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'completion_receipts_release_private_memory_after_cancelled_runs',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, 'std::mem::forget(state.completed.replace(pair));'))
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'completed cancellation receipts retained private memory' in (result.stdout + result.stderr)
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=180)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check concurrent fork exec cannot capture unsealed sibling descriptors
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features
          concurrent_fork_exec_does_not_capture_an_unsealed_descriptor
          -- --test-threads=1 --nocapture

      - name: Prove early spawn unlock leaks a real descriptor across exec
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/fork_exec_window.rs')
          original = source.read_text()
          old = '    let _guard = WINDOW.lock().unwrap_or_else(|error| error.into_inner());'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'concurrent_fork_exec_does_not_capture_an_unsealed_descriptor',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, old + '\n    drop(_guard);'))
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'child inherited a descriptor from another spawn window' in (result.stdout + result.stderr)
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=180)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check bounded supervisor inbox and moved request payloads
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features request_inbox_tests -- --test-threads=1

      - name: Prove excess-request and payload-copy regressions are detected
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/daemon.rs')
          original = source.read_text()
          cases = [
              ('mpsc::sync_channel(1)', 'mpsc::sync_channel(2)',
               'saturated_inbox_rejects_excess_work_without_blocking_control',
               'saturated supervisor inbox did not reject the excess request'),
              ('std::panic::AssertUnwindSafe(|| handle(request))',
               'std::panic::AssertUnwindSafe(|| handle(request.clone()))',
               'dispatch_moves_payload_and_preserves_panic_correlation',
               'dispatch copied the full request payload'),
          ]
          for old, mutant, case, marker in cases:
              assert original.count(old) == 1
              command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                         '-p', 'web-runtime', '--lib', '--no-default-features',
                         case, '--', '--test-threads=1']
              try:
                  source.write_text(original.replace(old, mutant))
                  result = subprocess.run(command, capture_output=True, text=True, timeout=180)
                  print(result.stdout, result.stderr)
                  assert result.returncode == 101 and marker in (result.stdout + result.stderr)
              finally:
                  source.write_text(original)
              subprocess.run(command, check=True, timeout=180)
              subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Prove actionability timeout diagnostics never invent DOM evidence
        run: python3 tools/check_unobserved_dom_deadline_mutations.py

      - name: Prove HTML fixtures release listener, thread, connections and owned body
        run: python3 tools/check_owned_html_fixture_mutations.py

      - name: Check coalesced heartbeat lifetime and receipt clocks
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features heartbeat -- --test-threads=1 --nocapture

      - name: Prove heartbeat replay retention and clock regressions are detected
        shell: python
        run: |
          import pathlib, subprocess
          cases = [
              ('crates/web-runtime/runtime/src/heartbeat_inbox.rs',
               'entry.received.take()', 'entry.received',
               'known_sessions_coalesce_and_consumed_or_closed_receipts_do_not_replay',
               'drained heartbeat was replayed'),
              ('crates/web-runtime/runtime/src/heartbeat_inbox.rs',
               'entry.received = Some(entry.received.map_or(received, |old| old.max(received)));',
               'entry.received = Some(entry.received.map_or(received, |old| old.max(received)));\n        std::mem::forget(session.to_owned());',
               'repeated_heartbeats_release_private_memory_in_a_fresh_process',
               'heartbeat receipts retained private memory'),
              ('crates/web-runtime/runtime/src/daemon.rs',
               'session.last_heartbeat = session.last_heartbeat.max(received);',
               'session.last_heartbeat = Instant::now();',
               'heartbeat_receipts_refresh_only_their_session_at_the_actual_receipt_time',
               'queued heartbeat must retain actual receipt time'),
          ]
          for path, old, mutant, case, marker in cases:
              source = pathlib.Path(path)
              original = source.read_text()
              assert original.count(old) == 1
              command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                         '-p', 'web-runtime', '--lib', '--no-default-features',
                         case, '--', '--test-threads=1', '--nocapture']
              try:
                  source.write_text(original.replace(old, mutant))
                  result = subprocess.run(command, capture_output=True, text=True, timeout=180)
                  print(result.stdout, result.stderr)
                  assert result.returncode == 101 and marker in (result.stdout + result.stderr)
              finally:
                  source.write_text(original)
              subprocess.run(command, check=True, timeout=180)
              subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)
      - name: Prove failed worker preparation releases kernel descriptors
        run: python3 tools/check_worker_fd_mutation.py

      - name: Prove accepted navigation sockets and fragmented headers are real
        run: python3 tools/check_navigation_fixture_stream_mutations.py

      - name: Run Linux sandbox and fexecve gates
        run: crates/web-runtime/scripts/run-linux-sandbox-gates.sh

      - name: Check proxy framing and byte preservation
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features policy_proxy -- --test-threads=1

      - name: Check bounded artifact-backed source results
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features model_facing_source -- --test-threads=1

      - name: Check identity-based live object quota
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features object_usage -- --test-threads=1

      - name: Prove live page closure returns only its own quota
        run: python3 tools/check_web_resource_mutations.py --slots


      - name: Check bounded native history receipt ownership
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features history_receipt -- --test-threads=1

      - name: Prove history receipts reject foreign tokens and release ownership
        run: python3 tools/check_web_history_receipt_mutation.py

      - name: Check shared session download staging before file creation
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features download_staging -- --test-threads=1

      - name: Check controller cannot replace download quota authority
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features
          controller_cannot_replace_download_session_authority -- --test-threads=1

      - name: Prove session quota, last file owner and controller authority invariants
        run: python3 tools/check_web_download_staging_mutations.py


      - name: Check bounded retained records
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features retained_records -- --test-threads=1

      - name: Prove event cursors cannot be replaced by rotating buffer length
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/retained_records.rs')
          original = source.read_text()
          old = '        self.sequence\n    }\n    pub fn first_after'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'event_cursor_survives_rotation_updates_pruning_and_clear', '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, old.replace('self.sequence', 'self.rows.len() as u64')))
              result = subprocess.run(command, capture_output=True, text=True, timeout=300)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'rotation replayed a retained event as new' in result.stdout + result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=300)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Prove pending event waits return their context budget
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/retained_records.rs')
          original = source.read_text()
