name: web-runtime Linux sandbox

# Focused gate: Landlock live deny + same-image fexecve on ubuntu-latest.
# Does not build Servo/V8. Does not replace codesign, Windows CI, or soak.
# Live evidence is the job log on ubuntu-latest, not a macOS host.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-runtime-linux-sandbox-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  RUST_BACKTRACE: "1"
  GREPPY_REQUIRE_LIVE_LANDLOCK: "1"

jobs:
  landlock-fexecve:
    name: Landlock + fexecve (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.95.0"


      - name: Check real process-family PSS and cleanup
        run: python3 bench/test_process_memory.py

      - name: Prove shared pages cannot be reported as summed RSS
        shell: python
        run: |
          import pathlib, subprocess, tempfile
          def run_case(capture=False):
              # Restored equal-size source can otherwise reuse the mutant's
              # timestamp-based .pyc within the same clock second.
              with tempfile.TemporaryDirectory(prefix='greppy-pss-pycache-') as cache:
                  return subprocess.run(['python3', '-X', 'pycache_prefix=' + cache,
                                         'bench/test_process_memory.py'],
                                        capture_output=capture, text=True, timeout=45,
                                        check=not capture)
          source = pathlib.Path('bench/process_memory.py')
          original = source.read_text()
          old = 'pss_bytes += metrics["Pss"]'
          assert original.count(old) == 1
          try:
              source.write_text(original.replace(old, 'pss_bytes += metrics["Rss"]'))
              result = run_case(capture=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 1 and 'AssertionError' in result.stderr
          finally:
              source.write_text(original)
          run_case()
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check typed status over private Unix sockets
        run: cargo test --locked -p greppy-web-client --lib status_probe_ -- --test-threads=1

      - name: Prove transport failure cannot be called an ownership denial
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-client/src/status_probe.rs')
          original = source.read_text()
          old = '_ => StatusProbeError::Transport,'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '-p', 'greppy-web-client', '--lib',
                     'status_probe_silent_connected_peer_is_not_an_ownership_denial', '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, '_ => StatusProbeError::NotOwned,'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'NotOwned' in result.stdout and 'Transport' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check nonretrying engine recovery
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features engine_failure_guidance_is_nonretrying -- --test-threads=1

      - name: Prove engine recovery rejects the old replay recommendation
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/daemon.rs')
          original = source.read_text()
          old = 'inspect greppy web doctor and the current page state; do not automatically repeat the failed operation'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'engine_failure_guidance_is_nonretrying', '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, 'retry the operation or inspect web.doctor'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'engine_failure_guidance_is_nonretrying' in result.stdout and 'FAILED' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)

          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check cancellation identity and completed-receipt memory lifetime
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features operation_control -- --test-threads=1 --nocapture

      - name: Prove finished operations cannot remain active
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/operation_control.rs')
          original = source.read_text()
          old = 'state.active.take()'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'finished_runs_are_not_active_and_old_cancellation_cannot_reach_a_new_run',
                     '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, 'state.active.clone()'))
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'finished operation remained active or cancellable' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=180)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Prove kernel private memory detects leaked completion receipts
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/operation_control.rs')
          original = source.read_text()
          old = 'state.completed = Some(pair);'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'completion_receipts_release_private_memory_after_cancelled_runs',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, 'std::mem::forget(state.completed.replace(pair));'))
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'completed cancellation receipts retained private memory' in (result.stdout + result.stderr)
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=180)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check concurrent fork exec cannot capture unsealed sibling descriptors
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features
          concurrent_fork_exec_does_not_capture_an_unsealed_descriptor
          -- --test-threads=1 --nocapture

      - name: Prove early spawn unlock leaks a real descriptor across exec
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/fork_exec_window.rs')
          original = source.read_text()
          old = '    let _guard = WINDOW.lock().unwrap_or_else(|error| error.into_inner());'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'concurrent_fork_exec_does_not_capture_an_unsealed_descriptor',
                     '--', '--test-threads=1', '--nocapture']
          try:
              source.write_text(original.replace(old, old + '\n    drop(_guard);'))
              result = subprocess.run(command, capture_output=True, text=True, timeout=180)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'child inherited a descriptor from another spawn window' in (result.stdout + result.stderr)
          finally:
              source.write_text(original)
          subprocess.run(command, check=True, timeout=180)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check bounded supervisor inbox and moved request payloads
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features request_inbox_tests -- --test-threads=1

      - name: Prove excess-request and payload-copy regressions are detected
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/daemon.rs')
          original = source.read_text()
          cases = [
              ('mpsc::sync_channel(1)', 'mpsc::sync_channel(2)',
               'saturated_inbox_rejects_excess_work_without_blocking_control',
               'saturated supervisor inbox did not reject the excess request'),
              ('std::panic::AssertUnwindSafe(|| handle(request))',
               'std::panic::AssertUnwindSafe(|| handle(request.clone()))',
               'dispatch_moves_payload_and_preserves_panic_correlation',
               'dispatch copied the full request payload'),
          ]
          for old, mutant, case, marker in cases:
              assert original.count(old) == 1
              command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                         '-p', 'web-runtime', '--lib', '--no-default-features',
                         case, '--', '--test-threads=1']
              try:
                  source.write_text(original.replace(old, mutant))
                  result = subprocess.run(command, capture_output=True, text=True, timeout=180)
                  print(result.stdout, result.stderr)
                  assert result.returncode == 101 and marker in (result.stdout + result.stderr)
              finally:
                  source.write_text(original)
              subprocess.run(command, check=True, timeout=180)
              subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check coalesced heartbeat lifetime and receipt clocks
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features heartbeat -- --test-threads=1 --nocapture

      - name: Prove heartbeat replay retention and clock regressions are detected
        shell: python
        run: |
          import pathlib, subprocess
          cases = [
              ('crates/web-runtime/runtime/src/heartbeat_inbox.rs',
               'entry.received.take()', 'entry.received',
               'known_sessions_coalesce_and_consumed_or_closed_receipts_do_not_replay',
               'drained heartbeat was replayed'),
              ('crates/web-runtime/runtime/src/heartbeat_inbox.rs',
               'entry.received = Some(entry.received.map_or(received, |old| old.max(received)));',
               'entry.received = Some(entry.received.map_or(received, |old| old.max(received)));\n        std::mem::forget(session.to_owned());',
               'repeated_heartbeats_release_private_memory_in_a_fresh_process',
               'heartbeat receipts retained private memory'),
              ('crates/web-runtime/runtime/src/daemon.rs',
               'session.last_heartbeat = session.last_heartbeat.max(received);',
               'session.last_heartbeat = Instant::now();',
               'heartbeat_receipts_refresh_only_their_session_at_the_actual_receipt_time',
               'queued heartbeat must retain actual receipt time'),
          ]
          for path, old, mutant, case, marker in cases:
              source = pathlib.Path(path)
              original = source.read_text()
              assert original.count(old) == 1
              command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                         '-p', 'web-runtime', '--lib', '--no-default-features',
                         case, '--', '--test-threads=1', '--nocapture']
              try:
                  source.write_text(original.replace(old, mutant))
                  result = subprocess.run(command, capture_output=True, text=True, timeout=180)
                  print(result.stdout, result.stderr)
                  assert result.returncode == 101 and marker in (result.stdout + result.stderr)
              finally:
                  source.write_text(original)
              subprocess.run(command, check=True, timeout=180)
              subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)
      - name: Prove failed worker preparation releases kernel descriptors
        run: python3 tools/check_worker_fd_mutation.py

      - name: Run Linux sandbox and fexecve gates
        run: crates/web-runtime/scripts/run-linux-sandbox-gates.sh

      - name: Check proxy framing and byte preservation
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features policy_proxy -- --test-threads=1

      - name: Check bounded artifact-backed source results
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features model_facing_source -- --test-threads=1

      - name: Check identity-based live object quota
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features object_usage -- --test-threads=1

      - name: Prove live page closure returns only its own quota
        run: python3 tools/check_web_resource_mutations.py --slots

      - name: Check bounded retained records
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features retained_records -- --test-threads=1

      - name: Prove retained-record byte bounds
        run: python3 tools/check_web_resource_mutations.py --records

      - name: Check wrapper resource lifecycle
        run: node --test crates/web-runtime/runtime/tests/playwright-resource-lifecycle.cjs

      - name: Prove closed-page retention is detected
        run: python3 tools/check_web_resource_mutations.py

      - name: Check payload-free record accounting
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features record_usage -- --test-threads=1

      - name: Prove record accounting regression detects an omitted counter
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/record_usage.rs')
          original = source.read_text()
          old = 'console.iter().fold(0u64'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'record_usage_crosses_a_real_frame', '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, 'console.iter().take(0).fold(0u64'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'assertion' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)

      - name: Check cancellation and absolute deadline during aborted-script drain
        run: >-
          cargo test --locked --manifest-path crates/web-runtime/Cargo.toml
          -p web-runtime --lib --no-default-features aborted_script -- --test-threads=1

      - name: Prove silent-controller cancellation detects a full-budget receive
        shell: python
        run: |
          import pathlib, subprocess
          source = pathlib.Path('crates/web-runtime/runtime/src/supervisor.rs')
          original = source.read_text()
          old = 'receive(remaining.min(Duration::from_millis(50)))'
          assert original.count(old) == 1
          command = ['cargo', 'test', '--locked', '--manifest-path', 'crates/web-runtime/Cargo.toml',
                     '-p', 'web-runtime', '--lib', '--no-default-features',
                     'aborted_script_receives_cancellation_while_protocol_is_silent', '--', '--test-threads=1']
          try:
              source.write_text(original.replace(old, 'receive(remaining)'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 101 and 'cancellation waited for the script deadline' in result.stdout
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Measure accounting IPC on one CPU
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
          print('MEASUREMENT_PROVENANCE cpu_affinity=' + str(sorted(os.sched_getaffinity(0))), flush=True)
          subprocess.run(['/usr/bin/time', '-v', 'cargo', 'test', '--locked', '--manifest-path',
                          'crates/web-runtime/Cargo.toml', '-p', 'web-runtime', '--lib',
                          '--no-default-features', 'record_usage_transport_comparison', '--',
                          '--ignored', '--test-threads=1', '--nocapture'], check=True)
          PY

      - name: Prove workload measurement includes its real process family
        shell: python
        run: |
          import pathlib, subprocess, tempfile
          source = pathlib.Path('crates/web-runtime/scripts/measure-web-efficiency.py')
          original = source.read_text()
          old = 'memory = ProcessTreeMemorySampler(child.pid)'
          assert original.count(old) == 1
          def run_case(capture=False):
              with tempfile.TemporaryDirectory(prefix='greppy-memory-integration-pycache-') as cache:
                  return subprocess.run(['python3', '-X', 'pycache_prefix=' + cache,
                      'crates/web-runtime/scripts/test-measure-web-efficiency.py',
                      'ProcessContract.test_execute_receipt_accounts_for_a_real_parent_and_child'],
                      capture_output=capture, text=True, timeout=30, check=not capture)
          try:
              source.write_text(original.replace(old, old + '; memory.identities.clear()'))
              result = run_case(capture=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 1 and 'AssertionError' in result.stderr
          finally:
              source.write_text(original)
          run_case()
          subprocess.run(['git', 'diff', '--exit-code', '--', str(source)], check=True)

      - name: Check complete-workflow measurement contracts without launching browsers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 crates/web-runtime/scripts/test-measure-web-efficiency.py
          node --check crates/web-runtime/runtime/fixtures/efficiency-workload.mjs
          node --check crates/web-runtime/runtime/fixtures/efficiency-native.mjs
          node --check crates/web-runtime/scripts/efficiency-reference.mjs
          node --check crates/web-runtime/scripts/check-efficiency-native-entry.mjs

      - name: Prove outcome verifier rejects invented successful work
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import pathlib, subprocess, sys
          source = pathlib.Path('crates/web-runtime/scripts/measure-web-efficiency.py')
          original = source.read_text()
          old = 'effect_verified = self.token(*identity) in self.effects'
          assert original.count(old) == 1
          command = [sys.executable, 'crates/web-runtime/scripts/test-measure-web-efficiency.py',
                     'OutcomeContract.test_claimed_success_without_post_effect_never_counts']
          try:
              source.write_text(original.replace(old, 'effect_verified = True'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 1 and 'AssertionError: 1 != 0' in result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)

      - name: Prove native entry rejects a restored relative module import
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import pathlib, subprocess, sys
          source = pathlib.Path('crates/web-runtime/scripts/measure-web-efficiency.py')
          original = source.read_text()
          old = 'source = adapter.replace(import_line, workload, 1)'
          assert original.count(old) == 1
          command = [sys.executable, 'crates/web-runtime/scripts/test-measure-web-efficiency.py',
                     'NativeEntryContract.test_entry_parses_with_only_the_native_playwright_import']
          try:
              source.write_text(original.replace(old, 'source = adapter'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 1 and "'./efficiency-workload.mjs'" in result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)

      - name: Prove native adapter cannot forward unsupported launch options
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import pathlib, subprocess, sys
          source = pathlib.Path('crates/web-runtime/runtime/fixtures/efficiency-native.mjs')
          original = source.read_text()
          old = 'return browserType.launch();'
          assert original.count(old) == 1
          command = [sys.executable, 'crates/web-runtime/scripts/test-measure-web-efficiency.py',
                     'NativeEntryContract.test_entry_parses_with_only_the_native_playwright_import']
          try:
              source.write_text(original.replace(old, 'return browserType.launch(options);'))
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, result.stderr)
              assert result.returncode == 1 and 'BrowserType.launch.options' in result.stderr
          finally:
              source.write_text(original)
          subprocess.run(command, check=True)
