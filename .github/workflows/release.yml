name: release

# Build ready-to-run binaries for macOS Apple Silicon, Linux x86_64, and
# Windows x86_64, sign them, and attach them to a GitHub Release.
#
# Triggers:
#   * push a tag `v*`   -> builds and publishes a Release with the assets
#   * manual dispatch   -> builds the assets and uploads them as workflow
#                          artifacts (no Release is created)
#
# Each job builds NATIVELY on its own runner (no cross-compilation), so the
# bundled C deps (tree-sitter grammars, SQLite) and the native embedded
# inference engines compile with the platform's own toolchain. The Rust
# version is the one pinned by rust-toolchain.toml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign_dry_run:
        description: >-
          RC signing dry-run: run the Apple/Windows signing, notarization and
          verification steps on the built artifacts WITHOUT a tag and WITHOUT
          publishing. Lets the first real signing test happen before the
          immutable release tag exists. Requires the signing secrets.
        type: boolean
        default: false
      measure_runtime_footprint:
        description: >-
          Include the hours-long diagnostic CPU/Metal runtime-footprint
          evidence in a manual dry-run. Release tags always include it.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-eligibility:
    name: immutable release subject
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Test release artifact contract and verifiers
        run: >-
          python3 -m unittest
          tools.test_release_artifacts
          tools.test_portable_cow_performance
          -v
      - name: Require green CI, CodeQL, security-audit and task-bank for this commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The publish job already binds summary-quality evidence to this SHA;
          # require the remaining mechanical gates on the exact release subject
          # as well - a tag must never outrun its checks. Agent benchmarks are
          # diagnostic inputs for subsequent releases, never release gates.
          for wf in ci.yml codeql.yml security-audit.yml task-bank-audit.yml filesystem-cow.yml; do
            ok="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --workflow "$wf" \
              --commit "$GITHUB_SHA" \
              --status completed \
              --json conclusion \
              --jq '[.[] | select(.conclusion == "success")] | length')"
            if [ "${ok:-0}" -lt 1 ]; then
              echo "::error::no successful $wf run exists for $GITHUB_SHA - all gates must be green on the exact release subject"
              exit 1
            fi
            echo "$wf: green for $GITHUB_SHA"
          done
          cow_performance_ok=0
          while read -r run_id; do
            test -n "$run_id" || continue
            jobs="$(gh run view "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --json jobs \
              --jq '[.jobs[] | select(.name == "Exact-SHA three-platform performance set" and .conclusion == "success")] | length')"
            if [ "${jobs:-0}" -ge 1 ]; then
              cow_performance_ok=1
              echo "three-platform portable CoW performance: green in run $run_id"
              break
            fi
          done < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --workflow filesystem-cow.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId')
          if [ "$cow_performance_ok" -ne 1 ]; then
            echo "::error::no successful exact-SHA three-platform performance set exists for $GITHUB_SHA"
            exit 1
          fi
      - name: Reject reused or replaced release subjects
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$EVENT_CREATED" = true || {
            echo '::error::release workflow requires a newly created tag event'
            exit 1
          }
          test "$EVENT_DELETED" != true && test "$EVENT_FORCED" != true || {
            echo '::error::deleted or force-updated release tags are not eligible'
            exit 1
          }
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$tag_commit" = "$GITHUB_SHA" || {
            echo "::error::tag resolves to $tag_commit instead of $GITHUB_SHA"
            exit 1
          }
          response="$RUNNER_TEMP/existing-release.json"
          status="$(curl --silent --show-error --location \
            --output "$response" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$status" in
            404) ;;
            200)
              echo "::error::a release already exists for $GITHUB_REF_NAME; releases are immutable"
              cat "$response"
              exit 1
              ;;
            *)
              echo "::error::cannot establish release immutability (GitHub API HTTP $status)"
              cat "$response"
              exit 1
              ;;
          esac

  model-redistribution:
    name: model redistribution provenance
    needs: release-eligibility
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Restore model assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            crates/cli/assets/qwen35-0.8b-mtp-q4km/Qwen3.5-0.8B-MTP-Q4_K_M.gguf
            crates/cli/assets/qwen35-0.8b-mtp-q4km/tokenizer.json
            crates/cli/assets/embeddinggemma-300m-q4k/embeddinggemma-300M-Q4_K.gguf
            crates/cli/assets/embeddinggemma-300m-q4k/tokenizer.json
          key: model-assets-${{ hashFiles('crates/cli/assets/MODEL_ASSETS.json') }}

      - name: Fetch model assets (release-hosted, sha-pinned)
        shell: bash
        run: ./tools/fetch_model_assets.sh


      - name: Verify model provenance and release readiness
        shell: bash
        run: |
          mode=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mode+=(--release)
          fi
          python3 tools/verify_model_redistribution.py \
            "${mode[@]}" \
            --git-commit "$GITHUB_SHA" \
            --report model-redistribution-report.json

      - name: Create deterministic Qwen training-evidence archive
        shell: bash
        run: |
          python3 tools/release_artifacts.py create-training-archive \
            --root . \
            --manifest training/qwen35/MANIFEST.sha256 \
            --output greppy-qwen35-training-evidence.tar.gz
          shasum -a 256 greppy-qwen35-training-evidence.tar.gz \
            > greppy-qwen35-training-evidence.tar.gz.sha256

      - name: Upload digest-bound provenance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-redistribution-${{ github.sha }}
          path: |
            model-redistribution-report.json
            greppy-qwen35-training-evidence.tar.gz
            greppy-qwen35-training-evidence.tar.gz.sha256
          if-no-files-found: error

      - name: Attest model provenance report
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: model-redistribution-report.json

      - name: Attest Qwen training evidence
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: greppy-qwen35-training-evidence.tar.gz

  build:
    name: build (${{ matrix.name }})
    needs: model-redistribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPU-accelerated where the platform supports it; the binary always
          # runs on CPU when no GPU is present (Metal detected at runtime, CUDA
          # dynamically loaded — no hard cudart link, so it starts without CUDA).
          - name: macos-arm64
            os: macos-latest
            asset: greppy-macos-arm64.pkg
            features: metal
            footprint_devices: 'cpu metal'
            runner_os: macOS
            runner_arch: ARM64
            rust_host: aarch64-apple-darwin
          # Pinned to 22.04: ubuntu-latest (24.04) links glibc 2.39, which
          # excludes every 22.04-LTS host (v0.1.0/v0.1.1 assets shipped with
          # that requirement — a real-world "GLIBC_2.39 not found" failure).
          # 22.04 builds run on anything with glibc >= 2.35.
          - name: linux-x86_64
            os: ubuntu-22.04
            asset: greppy-linux-x86_64.deb
            secondary_asset: greppy-linux-x86_64.rpm
            features: cuda
            footprint_devices: 'cpu'
            runner_os: Linux
            runner_arch: X64
            rust_host: x86_64-unknown-linux-gnu
            cuda_sub_packages: '["nvcc", "cudart"]'
            cuda_non_cuda_sub_packages: '["libcublas", "libcublas-dev"]'
          # v0.2.0 certifies Windows CPU inference and named-pipe daemons.
          # Windows CUDA and macOS Intel remain outside this release gate.
          - name: windows-x86_64
            os: windows-2022
            asset: greppy-windows-x86_64.msi
            features: cpu-only
            footprint_devices: 'cpu'
            runner_os: Windows
            runner_arch: X64
            rust_host: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Restore model assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            crates/cli/assets/qwen35-0.8b-mtp-q4km/Qwen3.5-0.8B-MTP-Q4_K_M.gguf
            crates/cli/assets/qwen35-0.8b-mtp-q4km/tokenizer.json
            crates/cli/assets/embeddinggemma-300m-q4k/embeddinggemma-300M-Q4_K.gguf
            crates/cli/assets/embeddinggemma-300m-q4k/tokenizer.json
          key: model-assets-${{ hashFiles('crates/cli/assets/MODEL_ASSETS.json') }}

      - name: Fetch model assets (release-hosted, sha-pinned)
        shell: bash
        run: ./tools/fetch_model_assets.sh

      - name: Verify bundled inference assets
        shell: bash
        run: |
          ./tools/fetch_model_assets.sh
          ls -lh crates/cli/assets/embeddinggemma-300m-q4k
          ls -lh crates/cli/assets/qwen35-0.8b-mtp-q4km
          python tools/verify_model_redistribution.py

      - name: Install Rust (pinned by rust-toolchain.toml)
        # dtolnay/rust-toolchain v1, pinned to an immutable source revision.
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.95.0'

      - name: Assert and record native build host
        shell: bash
        run: |
          python tools/release_artifacts.py record-build-environment \
            --output "build-environment-${{ matrix.name }}.json" \
            --expected-os "${{ matrix.runner_os }}" \
            --expected-arch "${{ matrix.runner_arch }}" \
            --expected-host "${{ matrix.rust_host }}" \
            --matrix-name "${{ matrix.name }}" \
            --features "${{ matrix.features }}" \
            --git-commit "$GITHUB_SHA" \
            --cargo-lock Cargo.lock

      # CUDA toolkit (nvcc + cuBLAS headers/import libs) so build.rs can
      # compile the vendored ggml-cuda kernels into the shared backend. No GPU
      # is needed at build time.
      - name: Install CUDA toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@4bd727d5619dc6fa323b1e76c3aa5dca94f5ec6d
        with:
          cuda: '12.5.0'
          method: network
          sub-packages: ${{ matrix.cuda_sub_packages }}
          non-cuda-sub-packages: ${{ matrix.cuda_non_cuda_sub_packages }}

      - name: Add MSVC developer tools to PATH
        if: runner.os == 'Windows' && matrix.features == 'cuda'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Build exact Greppy WinFsp transport fork
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fork = Join-Path $env:RUNNER_TEMP 'greppy-winfsp-fork'
          tools/build_winfsp_fork.ps1 -Destination $fork
          "GREPPY_WINFSP_FORK_ROOT=$fork" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        run: cargo build --locked --release --bin greppy --bin greppy-workspace-provider --features ${{ matrix.features }}

      - name: Stage private Greppy WinFsp user runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:GREPPY_WINFSP_FORK_ROOT 'build\VStudio\build\Release\greppyworkspacefsp-x64.dll'
          $driver = Join-Path $env:GREPPY_WINFSP_FORK_ROOT 'build\VStudio\build\Release\greppyworkspacefsp-x64.sys'
          Copy-Item -LiteralPath $runtime -Destination target\release\greppyworkspacefsp-x64.dll
          Copy-Item -LiteralPath $driver -Destination target\release\greppyworkspacefsp-x64.sys

      - name: Import and bind Microsoft-signed private driver
        if: (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run) && runner.os == 'Windows'
        shell: pwsh
        env:
          SIGNED_DRIVER_BASE64: ${{ secrets.WINDOWS_SIGNED_WINFSP_DRIVER_BASE64 }}
          DRIVER_CONTRACT_BASE64: ${{ secrets.WINDOWS_SIGNED_WINFSP_DRIVER_CONTRACT_BASE64 }}
        run: |
          if (-not $env:SIGNED_DRIVER_BASE64 -or -not $env:DRIVER_CONTRACT_BASE64) {
            throw 'signed Windows release requires the Microsoft-signed Greppy driver and its contract'
          }
          $unsigned = Join-Path $env:GREPPY_WINFSP_FORK_ROOT 'build\VStudio\build\Release\greppyworkspacefsp-x64.sys'
          $signed = Join-Path $PWD 'target\release\greppyworkspacefsp-x64.sys'
          $contract = Join-Path $PWD 'target\release\greppy-windows-driver-contract.json'
          [IO.File]::WriteAllBytes($signed, [Convert]::FromBase64String($env:SIGNED_DRIVER_BASE64))
          [IO.File]::WriteAllBytes($contract, [Convert]::FromBase64String($env:DRIVER_CONTRACT_BASE64))
          & signtool verify /kp /all /v $signed
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft-signed Greppy driver failed kernel-policy verification' }
          python tools/windows_driver_contract.py verify `
            --unsigned $unsigned `
            --signed $signed `
            --fork-manifest third_party/winfsp-greppy/upstream.json `
            --manifest $contract
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft-signed Greppy driver is not bound to this fork build' }

      - name: Create deterministic WinFsp corresponding-source archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/package_winfsp_source.py create `
            --source $env:GREPPY_WINFSP_FORK_ROOT `
            --repository-root . `
            --fork-root third_party/winfsp-greppy `
            --output greppy-winfsp-source.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'WinFsp corresponding-source creation failed' }
          python tools/package_winfsp_source.py verify greppy-winfsp-source.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'WinFsp corresponding-source verification failed' }

      - name: Install Linux package builders
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm cpio

      - name: Import macOS application identity
        if: (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run) && runner.os == 'macOS'
        shell: bash
        env:
          APPLICATION_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLICATION_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          test -n "$APPLICATION_CERTIFICATE_P12"
          test -n "$APPLICATION_CERTIFICATE_PASSWORD"
          test -n "$APPLICATION_SIGNING_IDENTITY"
          keychain="$RUNNER_TEMP/greppy-signing.keychain-db"
          application_cert="$RUNNER_TEMP/greppy-application-signing.p12"
          printf '%s' "$APPLICATION_CERTIFICATE_P12" | base64 -D > "$application_cert"
          security create-keychain -p "$APPLICATION_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLICATION_CERTIFICATE_PASSWORD" "$keychain"
          security import "$application_cert" -P "$APPLICATION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLICATION_CERTIFICATE_PASSWORD" "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLICATION_SIGNING_IDENTITY" target/release/greppy
          codesign --verify --strict --verbose=2 target/release/greppy

      - name: Build macOS FSKit application with bundled CLI
        if: runner.os == 'macOS'
        shell: bash
        env:
          SHOULD_SIGN: ${{ startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run }}
          APPLICATION_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APP_PROFILE_BASE64: ${{ secrets.MACOS_FSKIT_APP_PROVISIONING_PROFILE_BASE64 }}
          FSKIT_PROFILE_BASE64: ${{ secrets.MACOS_FSKIT_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          identity=-
          app_profile=
          fskit_profile=
          if [ "$SHOULD_SIGN" = true ]; then
            test -n "$APPLICATION_SIGNING_IDENTITY"
            test -n "$APP_PROFILE_BASE64"
            test -n "$FSKIT_PROFILE_BASE64"
            identity="$APPLICATION_SIGNING_IDENTITY"
            app_profile="$RUNNER_TEMP/greppy-fskit-app.provisionprofile"
            fskit_profile="$RUNNER_TEMP/greppy-fskit-extension.provisionprofile"
            printf '%s' "$APP_PROFILE_BASE64" | base64 -D > "$app_profile"
            printf '%s' "$FSKIT_PROFILE_BASE64" | base64 -D > "$fskit_profile"
          fi
          CODE_SIGN_IDENTITY="$identity" \
          APP_PROVISIONING_PROFILE="$app_profile" \
          FSKIT_PROVISIONING_PROFILE="$fskit_profile" \
          GREPPY_CLI_BINARY="$PWD/target/release/greppy" \
            platform/macos/build-fskit-app.sh "$RUNNER_TEMP/greppy-fskit"
          codesign --verify --deep --strict --verbose=2 \
            "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app"

      - name: Sign Windows binary with Authenticode
        if: (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run) && runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_PFX -or -not $env:CERTIFICATE_PASSWORD) {
            throw 'Windows release signing requires WINDOWS_CERTIFICATE_PFX_BASE64 and WINDOWS_CERTIFICATE_PASSWORD'
          }
          $cert = Join-Path $env:RUNNER_TEMP 'greppy-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:CERTIFICATE_PFX))
          & signtool sign /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 /f $cert /p $env:CERTIFICATE_PASSWORD target/release/greppy.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool sign failed' }
          & signtool sign /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 /f $cert /p $env:CERTIFICATE_PASSWORD target/release/greppy-workspace-provider.exe
          if ($LASTEXITCODE -ne 0) { throw 'provider signtool sign failed' }
          & signtool sign /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 /f $cert /p $env:CERTIFICATE_PASSWORD target/release/greppyworkspacefsp-x64.dll
          if ($LASTEXITCODE -ne 0) { throw 'Greppy WinFsp runtime signtool sign failed' }
          & signtool verify /pa /all /v target/release/greppy.exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool verify failed' }
          & signtool verify /pa /all /v target/release/greppy-workspace-provider.exe
          if ($LASTEXITCODE -ne 0) { throw 'provider signtool verify failed' }
          & signtool verify /pa /all /v target/release/greppyworkspacefsp-x64.dll
          if ($LASTEXITCODE -ne 0) { throw 'Greppy WinFsp runtime signtool verify failed' }
          "WINDOWS_SIGNING_PFX_PATH=$cert" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify CUDA backend runtime dependencies
        if: matrix.features == 'cuda'
        shell: bash
        run: |
          backend="$(find target/release/build -path '*/out/greppy_embed_native_cuda.so' -print -quit)"
          test -n "$backend" && test -f "$backend"
          readelf -d "$backend"
          ! readelf -d "$backend" | grep -E 'RPATH|RUNPATH'
          needed="$(readelf -d "$backend" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')"
          bad="$(printf '%s\n' "$needed" | grep -Ev '^(libcuda\.so\.1|libc\.so\.6|libm\.so\.6|libpthread\.so\.0|librt\.so\.1|libdl\.so\.2|libgcc_s\.so\.1|libstdc\+\+\.so\.6|ld-linux-x86-64\.so\.2)$' || true)"
          test -z "$bad" || { echo "::error::unexpected CUDA backend dependencies: $bad"; exit 1; }
          ! printf '%s\n' "$needed" | grep -E 'cudart|cublas|nvrtc'

      # Tag builds must ship a binary whose --version matches the tag —
      # v0.1.1 shipped reporting "grep 0.1.0" because the workspace version
      # was never bumped. Fails the release before any asset is published.
      - name: Assert --version matches the tag (Unix)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(target/release/greppy --version | awk '{print $NF}')"
          echo "tag=$want binary=$got"
          [ "$want" = "$got" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Assert --version matches the tag (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = $env:GITHUB_REF_NAME -replace '^v',''
          $got = (& target/release/greppy.exe --version).Split(' ')[-1]
          Write-Host "tag=$want binary=$got"
          if ($want -ne $got) { Write-Error "version mismatch"; exit 1 }

      - name: Notarize and staple macOS FSKit application
        if: (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run) && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_PASSWORD"
          app="$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app"
          notary_zip="$RUNNER_TEMP/greppy-fskit-notary.zip"
          ditto -c -k --keepParent "$app" "$notary_zip"
          submit_log="$RUNNER_TEMP/notarytool-app-submit.log"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait | tee "$submit_log"
          grep -q 'status: Accepted' "$submit_log" || {
            echo '::error::notarization was not Accepted'
            cat "$submit_log"
            exit 1
          }
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Archive notarized macOS FSKit application for signed dry-run activation
        if: inputs.sign_dry_run && runner.os == 'macOS'
        shell: bash
        run: |
          app="$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app"
          archive="$RUNNER_TEMP/greppy-fskit-notarized-stapled.zip"
          ditto -c -k --keepParent "$app" "$archive"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Upload notarized macOS FSKit application for signed dry-run activation
        if: inputs.sign_dry_run && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greppy-macos-fskit-notarized-${{ github.sha }}
          path: ${{ env.archive }}
          if-no-files-found: error
          retention-days: 7

      - name: Measure runtime footprint (Unix)
        if: runner.os != 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.measure_runtime_footprint)
        shell: bash
        run: |
          repo="$RUNNER_TEMP/greppy-footprint-serde"
          git clone --quiet --filter=blob:none https://github.com/serde-rs/serde.git "$repo"
          git -C "$repo" checkout --quiet --detach 1023d077510b4aef36a41ef56fdb7798568a2654
          for device in ${{ matrix.footprint_devices }}; do
            timeout_args=()
            if [ "$device" = cpu ]; then
              # 3600 was too tight: the serde embedding build on the 4-core
              # hosted runner needs >1h on the pure-CPU path (dry-run #4 hit
              # the cap). This is a measurement, not a quality gate - the
              # numbers land in the release evidence either way.
              timeout_args=(--timeout-seconds 7200)
            fi
            python3 bench/runtime_footprint.py \
              --greppy "$PWD/target/release/greppy" \
              --repo "$repo" \
              --semantic-query 'apply a rename case rule to a struct field' \
              --brief-symbol apply_to_field \
              --device "$device" \
              "${timeout_args[@]}" \
              --warm-repeats 3 \
              --output "runtime-footprint-${{ matrix.name }}-$device.json"
          done

      # Windows runtime-footprint measurement removed: greppy's CPU semantic
      # index of the pinned repo takes multiple hours on the hosted Windows
      # runner and cannot reliably complete inside the job. macOS and Linux
      # runtime evidence still ships; the Windows footprint is measured out of
      # band. (Its asset-contract entry is removed to match.)

      - name: Package (Unix)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(target/release/greppy --version | awk '{print $NF}')"
          platform/linux/build-packages.sh \
            target/release/greppy \
            target/release/greppy-workspace-provider \
              "$version" \
              "${{ matrix.asset }}" \
              "${{ matrix.secondary_asset }}" \
              dist

      - name: Import macOS installer identity
        if: (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run) && runner.os == 'macOS'
        shell: bash
        env:
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
        run: |
          test -n "$APPLICATION_CERTIFICATE_PASSWORD"
          test -n "$INSTALLER_CERTIFICATE_P12"
          test -n "$INSTALLER_CERTIFICATE_PASSWORD"
          test -n "$INSTALLER_SIGNING_IDENTITY"
          keychain="$RUNNER_TEMP/greppy-signing.keychain-db"
          installer_cert="$RUNNER_TEMP/greppy-installer-signing.p12"
          test -f "$keychain"
          printf '%s' "$INSTALLER_CERTIFICATE_P12" | base64 -D > "$installer_cert"
          security unlock-keychain -p "$APPLICATION_CERTIFICATE_PASSWORD" "$keychain"
          security import "$installer_cert" -P "$INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLICATION_CERTIFICATE_PASSWORD" "$keychain"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SHOULD_SIGN: ${{ startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run }}
          INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
        run: |
          version="$(target/release/greppy --version | awk '{print $NF}')"
          installer_identity=
          if [ "$SHOULD_SIGN" = true ]; then
            test -n "$INSTALLER_SIGNING_IDENTITY"
            installer_identity="$INSTALLER_SIGNING_IDENTITY"
          fi
          INSTALLER_SIGN_IDENTITY="$installer_identity" \
            platform/macos/build-fskit-pkg.sh \
              "$RUNNER_TEMP/greppy-fskit/GreppyWorkspaceFS.app" \
              "$version" \
              "${{ matrix.asset }}"
          rm -rf dist "$RUNNER_TEMP/greppy-pkg-expanded"
          pkgutil --expand-full "${{ matrix.asset }}" "$RUNNER_TEMP/greppy-pkg-expanded"
          mkdir -p dist
          ditto --norsrc --noextattr --noqtn \
            "$RUNNER_TEMP/greppy-pkg-expanded/greppy-component.pkg/Payload" dist

      - name: Notarize and staple macOS installer
        if: (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run) && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          submit_log="$RUNNER_TEMP/notarytool-pkg-submit.log"
          xcrun notarytool submit "${{ matrix.asset }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait | tee "$submit_log"
          grep -q 'status: Accepted' "$submit_log" || {
            echo '::error::installer notarization was not Accepted'
            cat "$submit_log"
            exit 1
          }
          xcrun stapler staple "${{ matrix.asset }}"
          xcrun stapler validate "${{ matrix.asset }}"
          pkgutil --check-signature "${{ matrix.asset }}"
          spctl --assess --type install --verbose=2 "${{ matrix.asset }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHOULD_SIGN: ${{ startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/greppy.exe dist/greppy.exe
          Copy-Item target/release/greppy-workspace-provider.exe dist/greppy-workspace-provider.exe
          Copy-Item target/release/greppyworkspacefsp-x64.dll dist/greppyworkspacefsp-x64.dll
          Copy-Item target/release/greppyworkspacefsp-x64.sys dist/greppyworkspacefsp-x64.sys
          Copy-Item bench/release_package_smoke.ps1 dist/release_package_smoke.ps1
          Copy-Item tools/release_artifacts.py dist/release_artifacts.py
          Copy-Item tools/package_winfsp_source.py,tools/verify_winfsp_fork.py,tools/windows_driver_contract.py dist/
          Copy-Item README.md,LICENSE,THIRD_PARTY.md,SECURITY.md,SUPPORT.md,CHANGELOG.md,Cargo.lock dist/
          Copy-Item licenses dist/licenses -Recurse
          $version = (& target/release/greppy.exe --version).Split(' ')[-1]
          $arguments = @{
            DistDir = 'dist'
            OutputPath = '${{ matrix.asset }}'
            Version = $version
          }
          if ($env:SHOULD_SIGN -eq 'true') {
            Copy-Item target/release/greppy-windows-driver-contract.json dist/
            Copy-Item target/release/greppy-windows-driver-contract.json ./greppy-windows-driver-contract.json
            $arguments.UnsignedDriverPath = Join-Path $env:GREPPY_WINFSP_FORK_ROOT 'build\VStudio\build\Release\greppyworkspacefsp-x64.sys'
            $arguments.DriverContractPath = 'target/release/greppy-windows-driver-contract.json'
          } else {
            $arguments.AllowUnsignedForSmokeTest = $true
          }
          tools/build_windows_msi.ps1 @arguments

      - name: Sign Windows MSI with Authenticode
        if: (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run) && runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_PATH -or -not $env:CERTIFICATE_PASSWORD) {
            throw 'Windows MSI signing material is unavailable'
          }
          & signtool sign /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 /f $env:WINDOWS_SIGNING_PFX_PATH /p $env:CERTIFICATE_PASSWORD '${{ matrix.asset }}'
          if ($LASTEXITCODE -ne 0) { throw 'MSI Authenticode signing failed' }
          & signtool verify /pa /all /v '${{ matrix.asset }}'
          if ($LASTEXITCODE -ne 0) { throw 'MSI Authenticode verification failed' }

      - name: Smoke-test packaged artifact (Unix)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          clean="$RUNNER_TEMP/greppy-package-smoke"
          mkdir -p "$clean/deb" "$clean/rpm"
          dpkg-deb -x "${{ matrix.asset }}" "$clean/deb"
          (cd "$clean/rpm" && rpm2cpio "$GITHUB_WORKSPACE/${{ matrix.secondary_asset }}" | cpio -idm --quiet)
          deb_root="$clean/deb"
          rpm_root="$clean/rpm"
          deb_bin="$deb_root/usr/lib/greppy/bin"
          rpm_bin="$rpm_root/usr/lib/greppy/bin"
          deb_licenses="$deb_root/usr/share/licenses/greppy"
          test ! -e "$clean/deb/usr/bin/grep"
          test ! -e "$deb_licenses/WINFSP-GPL-3.0-WITH-FLOSS-EXCEPTION.txt"
          ! compgen -G "$deb_licenses/RIFT-*" >/dev/null
          test -x "$deb_bin/greppy-workspace-provider"
          test -x "$rpm_bin/greppy-workspace-provider"
          test -f "$deb_root/usr/lib/systemd/user/greppy-workspace-provider.service"
          cmp "$deb_root/usr/lib/systemd/user/greppy-workspace-provider.service" \
            "$rpm_root/usr/lib/systemd/user/greppy-workspace-provider.service"
          grep -F 'Restart=on-failure' \
            "$deb_root/usr/lib/systemd/user/greppy-workspace-provider.service"
          cmp "$deb_bin/greppy" "$rpm_bin/greppy"
          cmp "$deb_bin/greppy-workspace-provider" "$rpm_bin/greppy-workspace-provider"
          for license in \
            EMBEDDED-MODEL-TERMS.md EMBEDDINGGEMMA-NOTICE.txt GEMMA-TERMS.html \
            EMBEDDINGGEMMA-MODIFICATIONS.txt EMBEDDINGGEMMA-PROVENANCE.json \
            QWEN3.5-APACHE-2.0.txt QWEN3.5-MODIFICATIONS.txt \
            QWEN3.5-PROVENANCE.json QWEN3.5-TRAINING-DATA-MANIFEST.json \
            MODEL-REDISTRIBUTION.lock.json; do
            test -s "$deb_licenses/$license"
          done
          bash "$clean/deb/usr/lib/greppy/release-tests/release_package_smoke.sh" \
            "$deb_bin/greppy" "$clean/work"

      - name: Smoke-test packaged artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/Applications/GreppyWorkspaceFS.app"
          cli="$app/Contents/Resources/bin/greppy"
          test -x "$cli"
          test -L dist/usr/local/bin/greppy
          test "$(readlink dist/usr/local/bin/greppy)" = \
            /Applications/GreppyWorkspaceFS.app/Contents/Resources/bin/greppy
          codesign --verify --deep --strict --verbose=2 "$app"
          "$cli" --version

      - name: Smoke-test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'greppy-package-smoke'
          New-Item -ItemType Directory -Force "$clean/bin","$clean/store","$clean/repo" | Out-Null
          $process = Start-Process msiexec.exe -ArgumentList @('/a', "`"$PWD\${{ matrix.asset }}`"", '/qn', "TARGETDIR=`"$clean\bin`"") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "administrative MSI extraction failed: $($process.ExitCode)" }
          $greppy = @(Get-ChildItem "$clean\bin" -Filter greppy.exe -File -Recurse)
          if ($greppy.Count -ne 1) { throw "administrative image contains $($greppy.Count) greppy.exe files" }
          $installed = $greppy[0].Directory.FullName
          foreach ($license in @(
            'EMBEDDED-MODEL-TERMS.md', 'EMBEDDINGGEMMA-NOTICE.txt', 'GEMMA-TERMS.html',
            'EMBEDDINGGEMMA-MODIFICATIONS.txt', 'EMBEDDINGGEMMA-PROVENANCE.json',
            'QWEN3.5-APACHE-2.0.txt', 'QWEN3.5-MODIFICATIONS.txt',
            'QWEN3.5-PROVENANCE.json', 'QWEN3.5-TRAINING-DATA-MANIFEST.json',
            'MODEL-REDISTRIBUTION.lock.json')) {
            if (-not (Test-Path (Join-Path $installed "licenses\$license"))) { throw "missing $license" }
          }
          if (-not (Test-Path (Join-Path $installed 'greppyworkspacefsp-x64.dll'))) { throw 'missing private Greppy WinFsp runtime' }
          if (-not (Test-Path (Join-Path $installed 'greppyworkspacefsp-x64.sys'))) { throw 'missing private Greppy WinFsp driver' }
          if (Test-Path (Join-Path $installed 'winfsp-x64.dll')) { throw 'official WinFsp runtime leaked into package' }
          & (Join-Path $installed 'release_package_smoke.ps1') -Binary (Join-Path $installed 'greppy.exe') -Work "$clean/work"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: dist
          format: spdx-json
          output-file: ${{ matrix.asset }}.spdx.json
          upload-artifact: false

      - name: Bind and verify release contents in SPDX SBOM
        shell: bash
        run: |
          python tools/release_artifacts.py augment-spdx \
            --sbom "${{ matrix.asset }}.spdx.json" \
            --dist dist \
            --cargo-lock Cargo.lock \
            --target "${{ matrix.rust_host }}"
          python tools/release_artifacts.py verify-spdx \
            --sbom "${{ matrix.asset }}.spdx.json" \
            --dist dist \
            --cargo-lock Cargo.lock \
            --target "${{ matrix.rust_host }}"
          if [ "${{ runner.os }}" = Linux ]; then
            cp "${{ matrix.asset }}.spdx.json" "${{ matrix.secondary_asset }}.spdx.json"
          fi

      - name: Generate SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          if [ "${{ runner.os }}" = Linux ]; then
            shasum -a 256 "${{ matrix.secondary_asset }}" > "${{ matrix.secondary_asset }}.sha256"
          fi

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Get-Location) "${{ matrix.asset }}.sha256"
          [IO.File]::WriteAllText(
            $checksumPath,
            "$hash  ${{ matrix.asset }}`n",
            [Text.Encoding]::ASCII
          )
          $bytes = [IO.File]::ReadAllBytes($checksumPath)
          if (($bytes -contains [byte]13) -or ($bytes[-1] -ne [byte]10)) {
            throw 'checksum sidecar must use a single LF-terminated portable line'
          }
          $source = 'greppy-winfsp-source.tar.gz'
          $sourceHash = (Get-FileHash -Algorithm SHA256 $source).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$source.sha256",
            "$sourceHash  $source`n",
            [Text.Encoding]::ASCII
          )

      - name: Attest release package provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: ${{ matrix.asset }}

      - name: Attest secondary Linux package provenance
        if: runner.os == 'Linux'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: ${{ matrix.secondary_asset }}

      - name: Attest SBOM provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: ${{ matrix.asset }}.spdx.json

      - name: Attest secondary Linux SBOM provenance
        if: runner.os == 'Linux'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: ${{ matrix.secondary_asset }}.spdx.json

      - name: Attest runtime footprint evidence
        if: runner.os != 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.measure_runtime_footprint)
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: runtime-footprint-*.json

      - name: Attest native build environment
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: build-environment-${{ matrix.name }}.json

      - name: Attest WinFsp corresponding source
        if: runner.os == 'Windows'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: greppy-winfsp-source.tar.gz

      - name: Attest Microsoft-signed driver binding
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run)
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: greppy-windows-driver-contract.json

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            ${{ matrix.asset }}.spdx.json
            ${{ matrix.secondary_asset }}
            ${{ matrix.secondary_asset }}.sha256
            ${{ matrix.secondary_asset }}.spdx.json
            runtime-footprint-*.json
            build-environment-${{ matrix.name }}.json
            greppy-winfsp-source.tar.gz
            greppy-winfsp-source.tar.gz.sha256
            greppy-windows-driver-contract.json

  verify-packages:
    name: clean package (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            asset: greppy-macos-arm64.pkg
            rust_host: aarch64-apple-darwin
          - name: linux-x86_64-no-toolkit
            os: ubuntu-22.04
            asset: greppy-linux-x86_64.deb
            secondary_asset: greppy-linux-x86_64.rpm
            rust_host: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-2022
            asset: greppy-windows-x86_64.msi
            rust_host: x86_64-pc-windows-msvc
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.asset }}
          path: package

      - name: Verify clean Unix host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes rpm cpio
          mkdir -p unpack-deb unpack-rpm store repo
          (cd package && shasum -a 256 -c "${{ matrix.asset }}.sha256")
          (cd package && shasum -a 256 -c "${{ matrix.secondary_asset }}.sha256")
          dpkg-deb -x "package/${{ matrix.asset }}" unpack-deb
          (cd unpack-rpm && rpm2cpio "$GITHUB_WORKSPACE/package/${{ matrix.secondary_asset }}" | cpio -idm --quiet)
          deb_root="$PWD/unpack-deb"
          rpm_root="$PWD/unpack-rpm"
          deb_bin="$deb_root/usr/lib/greppy/bin"
          rpm_bin="$rpm_root/usr/lib/greppy/bin"
          test ! -e "$deb_root/usr/bin/grep"
          test -L "$deb_root/usr/bin/greppy"
          test "$(readlink "$deb_root/usr/bin/greppy")" = ../lib/greppy/bin/greppy
          test -x "$deb_bin/greppy-workspace-provider"
          test -x "$rpm_bin/greppy-workspace-provider"
          cmp "$deb_bin/greppy" "$rpm_bin/greppy"
          cmp "$deb_bin/greppy-workspace-provider" "$rpm_bin/greppy-workspace-provider"
          bash "$deb_root/usr/lib/greppy/release-tests/release_package_smoke.sh" \
            "$deb_bin/greppy" "$PWD/smoke"
          bash "$deb_root/usr/lib/greppy/release-tests/release_daemon_stress.sh" \
            "$deb_bin/greppy" "$PWD/daemon-stress"
          ! ldd "$deb_bin/greppy" | grep -E 'cudart|cublas|nvrtc'
          workspace_parent="$RUNNER_TEMP/greppy-installed-workspace"
          export GREPPY_WORKSPACE_DIR="$workspace_parent/data"
          cleanup_provider() {
            mountpoint -q "$workspace_parent/workspace-mount" && \
              fusermount3 -u "$workspace_parent/workspace-mount" || true
            if [ -s "$GREPPY_WORKSPACE_DIR/provider.pid" ]; then
              kill "$(cat "$GREPPY_WORKSPACE_DIR/provider.pid")" 2>/dev/null || true
            fi
            autostart_root="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
            rm -f "$autostart_root/default.target.wants/greppy-workspace-provider.service"
            rm -f "$autostart_root/greppy-workspace-provider.service"
          }
          trap cleanup_provider EXIT
          "$deb_bin/greppy" workspace setup
          autostart_root="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
          test -f "$autostart_root/greppy-workspace-provider.service"
          test "$(readlink "$autostart_root/default.target.wants/greppy-workspace-provider.service")" = \
            ../greppy-workspace-provider.service
          grep -F "ExecStart=\"$deb_bin/greppy-workspace-provider\"" \
            "$autostart_root/greppy-workspace-provider.service"
          "$deb_bin/greppy" workspace doctor --json > "$RUNNER_TEMP/workspace-doctor.json"
          jq -e '
            .healthy == true and
            .smoke.read == true and
            .smoke.write == true and
            .smoke.partial_write == true and
            .smoke.rename == true and
            .smoke.delete == true
          ' "$RUNNER_TEMP/workspace-doctor.json" >/dev/null
          cleanup_provider
          trap - EXIT
          if [[ "$GITHUB_REF" == refs/tags/* || "${{ inputs.measure_runtime_footprint }}" == true ]]; then
            test -s package/runtime-footprint-linux-x86_64-cpu.json
          fi
          python3 "$deb_root/usr/lib/greppy/release-tests/release_artifacts.py" verify-spdx \
            --sbom "package/${{ matrix.asset }}.spdx.json" \
            --dist "$deb_root" \
            --cargo-lock "$deb_root/usr/share/doc/greppy/Cargo.lock" \
            --target "${{ matrix.rust_host }}"
          python3 "$rpm_root/usr/lib/greppy/release-tests/release_artifacts.py" verify-spdx \
            --sbom "package/${{ matrix.secondary_asset }}.spdx.json" \
            --dist "$rpm_root" \
            --cargo-lock "$rpm_root/usr/share/doc/greppy/Cargo.lock" \
            --target "${{ matrix.rust_host }}"
          docker run --rm -v "$PWD/package:/packages:ro" ubuntu:22.04 bash -ceu '
            apt-get update >/dev/null
            apt-get install --yes /packages/greppy-linux-x86_64.deb >/dev/null
            greppy --version
            test -x /usr/lib/greppy/bin/greppy-workspace-provider
            apt-get remove --yes greppy >/dev/null
            test ! -e /usr/bin/greppy
            test ! -e /usr/lib/greppy
          '
          docker run --rm -v "$PWD/package:/packages:ro" fedora:latest bash -ceu '
            dnf install --assumeyes /packages/greppy-linux-x86_64.rpm >/dev/null
            greppy --version
            test -x /usr/lib/greppy/bin/greppy-workspace-provider
            dnf remove --assumeyes greppy >/dev/null
            test ! -e /usr/bin/greppy
            test ! -e /usr/lib/greppy
          '

      - name: Verify clean macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          (cd package && shasum -a 256 -c "${{ matrix.asset }}.sha256")
          pkgutil --expand-full "package/${{ matrix.asset }}" unpack
          payload="$PWD/unpack/greppy-component.pkg/Payload"
          app="$payload/Applications/GreppyWorkspaceFS.app"
          cli="$app/Contents/Resources/bin/greppy"
          docs="$payload/usr/local/share/doc/greppy"
          test -x "$cli"
          test -L "$payload/usr/local/bin/greppy"
          test "$(readlink "$payload/usr/local/bin/greppy")" = \
            /Applications/GreppyWorkspaceFS.app/Contents/Resources/bin/greppy
          codesign --verify --deep --strict --verbose=2 "$app"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            xcrun stapler validate "package/${{ matrix.asset }}"
            pkgutil --check-signature "package/${{ matrix.asset }}"
            spctl --assess --type install --verbose=2 "package/${{ matrix.asset }}"
          fi
          "$cli" --version
          bash "$docs/release_package_smoke.sh" "$cli" "$PWD/smoke"
          bash "$docs/release_daemon_stress.sh" "$cli" "$PWD/daemon-stress"
          if [[ "$GITHUB_REF" == refs/tags/* || "${{ inputs.measure_runtime_footprint }}" == true ]]; then
            test -s package/runtime-footprint-macos-arm64-cpu.json
            test -s package/runtime-footprint-macos-arm64-metal.json
          fi
          python3 "$docs/release_artifacts.py" verify-spdx \
            --sbom "package/${{ matrix.asset }}.spdx.json" \
            --dist "$payload" \
            --cargo-lock "$docs/Cargo.lock" \
            --target "${{ matrix.rust_host }}"

      - name: Verify clean Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHOULD_SIGN: ${{ startsWith(github.ref, 'refs/tags/') || inputs.sign_dry_run }}
        run: |
          New-Item -ItemType Directory -Force administrative,store,repo | Out-Null
          $line = (Get-Content "package/${{ matrix.asset }}.sha256" -Raw).Trim()
          $want = ($line -split '\s+')[0]
          $got = (Get-FileHash -Algorithm SHA256 "package/${{ matrix.asset }}").Hash.ToLowerInvariant()
          if ($want -ne $got) { throw "package checksum mismatch: $got != $want" }
          $sourceLine = (Get-Content 'package/greppy-winfsp-source.tar.gz.sha256' -Raw).Trim()
          $sourceWant = ($sourceLine -split '\s+')[0]
          $sourceGot = (Get-FileHash -Algorithm SHA256 'package/greppy-winfsp-source.tar.gz').Hash.ToLowerInvariant()
          if ($sourceWant -ne $sourceGot) { throw "source checksum mismatch: $sourceGot != $sourceWant" }
          if (-not (Test-Path "package/${{ matrix.asset }}.spdx.json")) { throw 'missing SPDX SBOM' }
          $admin = Start-Process msiexec.exe -ArgumentList @('/a', "`"$PWD\package\${{ matrix.asset }}`"", '/qn', "TARGETDIR=`"$PWD\administrative`"") -Wait -PassThru
          if ($admin.ExitCode -notin @(0,3010)) { throw "administrative MSI extraction failed: $($admin.ExitCode)" }
          $adminGreppy = @(Get-ChildItem administrative -Filter greppy.exe -File -Recurse)
          if ($adminGreppy.Count -ne 1) { throw "administrative image contains $($adminGreppy.Count) greppy.exe files" }
          $adminRoot = $adminGreppy[0].Directory.FullName
          if (-not (Test-Path (Join-Path $adminRoot 'greppy-workspace-provider.exe'))) { throw 'missing portable workspace provider' }
          if (-not (Test-Path (Join-Path $adminRoot 'greppyworkspacefsp-x64.dll'))) { throw 'missing private driver runtime' }
          if (-not (Test-Path (Join-Path $adminRoot 'greppyworkspacefsp-x64.sys'))) { throw 'missing private kernel driver' }
          if (Test-Path (Join-Path $adminRoot 'winfsp-x64.dll')) { throw 'official WinFsp runtime leaked into MSI' }
          if ($env:SHOULD_SIGN -eq 'true') {
            & signtool verify /pa /all /v "package/${{ matrix.asset }}"
            if ($LASTEXITCODE -ne 0) { throw 'MSI signature verification failed' }
            foreach ($binary in @('greppy.exe', 'greppy-workspace-provider.exe', 'greppyworkspacefsp-x64.dll')) {
              $signature = Get-AuthenticodeSignature (Join-Path $adminRoot $binary)
              if ($signature.Status -ne 'Valid') { throw "invalid Authenticode signature for ${binary}: $($signature.Status)" }
            }
            & signtool verify /kp /all /v (Join-Path $adminRoot 'greppyworkspacefsp-x64.sys')
            if ($LASTEXITCODE -ne 0) { throw 'kernel driver signature verification failed' }
            python (Join-Path $adminRoot 'windows_driver_contract.py') verify-signed `
              --signed (Join-Path $adminRoot 'greppyworkspacefsp-x64.sys') `
              --fork-manifest third_party/winfsp-greppy/upstream.json `
              --manifest (Join-Path $adminRoot 'greppy-windows-driver-contract.json')
            if ($LASTEXITCODE -ne 0) { throw 'installed driver contract verification failed' }
          }
          python (Join-Path $adminRoot 'release_artifacts.py') verify-spdx `
            --sbom "package/${{ matrix.asset }}.spdx.json" `
            --dist $adminRoot `
            --cargo-lock (Join-Path $adminRoot 'Cargo.lock') `
            --target "${{ matrix.rust_host }}"
          if ($LASTEXITCODE -ne 0) { throw 'SPDX verification failed' }
          python (Join-Path $adminRoot 'package_winfsp_source.py') verify package/greppy-winfsp-source.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'WinFsp corresponding-source verification failed' }
          & (Join-Path $adminRoot 'release_package_smoke.ps1') -Binary (Join-Path $adminRoot 'greppy.exe') -Work "$PWD/smoke"
          if ($env:SHOULD_SIGN -eq 'true') {
            $log = Join-Path $env:RUNNER_TEMP 'greppy-msi-install.log'
            $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$PWD\package\${{ matrix.asset }}`"", '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
            if ($install.ExitCode -ne 0) { Get-Content $log; throw "MSI installation failed: $($install.ExitCode)" }
            $installed = Join-Path $env:ProgramFiles 'Greppy'
            if (-not (Test-Path (Join-Path $installed 'greppy.exe'))) { throw 'installed greppy.exe is missing' }
            $env:GREPPY_WORKSPACE_DIR = Join-Path $env:RUNNER_TEMP 'installed-workspace\data'
            & (Join-Path $installed 'greppy.exe') workspace setup
            if ($LASTEXITCODE -ne 0) { throw 'installed workspace setup failed' }
            & (Join-Path $installed 'greppy.exe') workspace doctor --json | Out-File "$env:RUNNER_TEMP\windows-workspace-doctor.json" -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'installed workspace doctor failed' }
            $doctor = Get-Content "$env:RUNNER_TEMP\windows-workspace-doctor.json" -Raw | ConvertFrom-Json
            if (-not $doctor.healthy -or -not $doctor.smoke.read -or -not $doctor.smoke.write -or -not $doctor.smoke.partial_write -or -not $doctor.smoke.rename -or -not $doctor.smoke.delete) {
              throw 'installed workspace doctor did not pass the complete smoke contract'
            }
            $pidFile = Join-Path $env:GREPPY_WORKSPACE_DIR 'provider.pid'
            if (Test-Path $pidFile) {
              Stop-Process -Id ([int](Get-Content $pidFile -Raw).Trim()) -Force -ErrorAction SilentlyContinue
            }
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$PWD\package\${{ matrix.asset }}`"", '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0,3010)) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
            if (Test-Path $installed) { throw 'MSI uninstall left the Greppy installation directory behind' }
          }
          # TODO(windows daemon stress): port bench/release_daemon_stress.sh
          # to PowerShell for this leg. Portable as-is: concurrency/queue
          # limits/oversize/slow-client/protocol scenarios (the raw client
          # needs System.IO.Pipes.NamedPipeClientStream against the
          # \\.\pipe\greppy-* endpoints instead of unix sockets), kill -9
          # (Stop-Process -Force) + respawn, and TTL-based eviction/exit.
          # Genuinely NOT portable: the two stale-endpoint-file scenarios
          # (leftover socket file after SIGKILL; junk regular file at the
          # endpoint path) - named pipes vanish with their owning process,
          # so no stale filesystem endpoint can exist on Windows.

  publish:
    name: publish gated release
    needs: [model-redistribution, build, verify-packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Materialize digest-locked summary cases
        run: |
          python3 tools/materialize_benchmark_corpus.py \
            --target bench/summary_quality/cases_v1.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
      - name: Verify release provenance approval subject
        shell: bash
        run: |
          report="release-assets/model-redistribution-$GITHUB_SHA/model-redistribution-report.json"
          test -s "$report"
          test "$(jq -r .schema_version "$report")" = greppy.model-redistribution-report.v1
          test "$(jq -r .mode "$report")" = release
          test "$(jq -r .passed "$report")" = true
          test "$(jq -r .git_commit "$report")" = "$GITHUB_SHA"
          test "$(jq -r .lock_sha256 "$report")" = \
            "$(sha256sum licenses/MODEL-REDISTRIBUTION.lock.json | cut -d' ' -f1)"
          evidence_dir="release-assets/model-redistribution-$GITHUB_SHA"
          (cd "$evidence_dir" && \
            shasum -a 256 -c greppy-qwen35-training-evidence.tar.gz.sha256)
          python3 tools/release_artifacts.py create-training-archive \
            --root . \
            --manifest training/qwen35/MANIFEST.sha256 \
            --output "$RUNNER_TEMP/qwen-evidence-reproduction.tar.gz"
          test "$(sha256sum "$evidence_dir/greppy-qwen35-training-evidence.tar.gz" | cut -d' ' -f1)" = \
            "$(sha256sum "$RUNNER_TEMP/qwen-evidence-reproduction.tar.gz" | cut -d' ' -f1)"
      # Agent benchmarks are deliberately absent here. They discover candidate
      # defects for the next release, but never decide whether this release may
      # publish. CI, security, task-bank, summary quality, provenance, and clean
      # package and portable-CoW verification are the release gates.
      - name: Download passing summary-quality gate for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_info="$(gh run list \
            --workflow summary-quality.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId,headSha \
            --jq '.[0] | "\(.databaseId) \(.headSha)"')"
          run_id="${run_info%% *}"; sq_sha="${run_info##* }"
          test -n "$run_id" || {
            echo '::error::no successful summary-quality gate exists'
            exit 1
          }
          test "$sq_sha" = "$GITHUB_SHA" || {
            echo "::error::summary-quality gate is bound to $sq_sha instead of $GITHUB_SHA"
            exit 1
          }
          mkdir -p release-assets/summary-quality
          gh run download "$run_id" \
            --name "greppy-summary-quality-$sq_sha" \
            --dir release-assets/summary-quality
          (cd release-assets/summary-quality && shasum -a 256 -c greppy-summary-quality.tar.gz.sha256)
          mkdir -p release-assets/summary-quality/verified
          tar -C release-assets/summary-quality/verified \
            -xzf release-assets/summary-quality/greppy-summary-quality.tar.gz
          manifest=release-assets/summary-quality/verified/MANIFEST.json
          results=release-assets/summary-quality/verified/results.json
          judgments=release-assets/summary-quality/verified/judgments.json
          gate=release-assets/summary-quality/verified/gate.json
          test "$(jq -r .schema_version "$manifest")" = greppy.summary-quality-evidence.v1
          test "$(jq -r .raw_traces_published "$manifest")" = false
          test "$(jq -r .gate.passed "$manifest")" = true
          test "$(jq -r .passed "$gate")" = true
          test "$(jq -r .cases_sha256 "$manifest")" = \
            "$(sha256sum bench/summary_quality/cases_v1.json | cut -d' ' -f1)"
          test "$(jq -r .results_sha256 "$manifest")" = \
            "$(sha256sum "$results" | cut -d' ' -f1)"
          test "$(jq -r .judgments_sha256 "$manifest")" = \
            "$(sha256sum "$judgments" | cut -d' ' -f1)"
          test "$(jq -r .gate_sha256 "$manifest")" = \
            "$(sha256sum "$gate" | cut -d' ' -f1)"
      - name: Stage and verify exact release asset contract
        shell: bash
        run: |
          python3 tools/release_artifacts.py stage-release \
            --source release-assets \
            --output release-publish \
            --contract tools/release_asset_contract.v1.json \
            --git-commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --cargo-lock Cargo.lock
          python3 tools/release_artifacts.py verify-staged-release \
            --output release-publish \
            --contract tools/release_asset_contract.v1.json \
            --git-commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --cargo-lock Cargo.lock
          cat release-publish/SHA256SUMS
      - name: Attest aggregate checksums
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: release-publish/SHA256SUMS
      - name: Attest exact release asset manifest
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: release-publish/RELEASE-ASSETS.json
      - name: Create immutable release
        # gh release create fails atomically if this tag already has a release.
        # The eligibility job also rejects force-updated tag events before any
        # model or build work begins.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-publish/*
