name: Rust dependency security audit

# No path filter: "RustSec advisory database" is a required check on main and
# release.yml requires a green run on the exact release commit. A filtered
# workflow never reports on code-only changes, which leaves such PRs blocked
# and such commits untaggable.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  rustsec:
    name: RustSec advisory database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # Install cargo-audit with --locked so it uses its own published
      # Cargo.lock. Installing the unlocked "latest" resolves the transitive
      # dep kstring to 2.0.4, whose MSRV (Rust 1.96) exceeds the toolchain and
      # fails to compile cargo-audit itself (not a project advisory).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Informational maintenance advisories only. `paste` is a transitive
      # compile-time proc macro. RUSTSEC-2026-0370, 0371, and 0372 are the
      # unmaintained zbus crates pulled by pinned agent-desktop v1.1.0 on
      # Linux. Neither set describes a vulnerability. Bounds and removal
      # conditions are in SECURITY.md; the pin is in THIRD_PARTY.md.
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372
          cargo audit --file crates/web-runtime/Cargo.lock \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071
