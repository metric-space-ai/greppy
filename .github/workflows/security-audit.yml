name: Rust dependency security audit

# No path filter: "RustSec advisory database" is a required check on main and
# release.yml requires a green run on the exact release commit. A filtered
# workflow never reports on code-only changes, which leaves such PRs blocked
# and such commits untaggable.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  rustsec:
    name: RustSec advisory database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # Install cargo-audit with --locked so it uses its own published
      # Cargo.lock. Installing the unlocked "latest" resolves the transitive
      # dep kstring to 2.0.4, whose MSRV (Rust 1.96) exceeds the toolchain and
      # fails to compile cargo-audit itself (not a project advisory).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Informational maintenance advisory only. The locked `paste` crate is a
      # transitive compile-time proc macro, not runtime code. The bounded
      # exception and removal condition are in SECURITY.md.
      - name: Run cargo audit
        run: |
          cargo audit --ignore RUSTSEC-2024-0436
          cargo audit --file crates/web-runtime/Cargo.lock \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071
